# Build the `dagron` binary for every supported platform and attach it to the
# release the sync already created. Active in the PUBLIC MIRROR
# (lucheeseng827/dagron); inert in the monorepo, which never carries the stamped
# `v*.*.*` tag this fires on.
#
# Why this exists: before it, a release shipped six container images and an OCI
# chart and nothing you could run directly. "Install dagron" meant "install
# Docker", or "install a Rust toolchain and wait for a compile" — which is a
# poor first impression and, for the single-binary/edge story the project makes,
# an odd gap.
#
# Two binaries are published. The root `dagron` binary is the one a person
# runs (`dagron dev`, `dagron validate`, a one-shot run); dagron-api, the GitOps
# worker and the MCP server are services and ship as images. `dagron-ci-exec`,
# the step runner a CI task's image carries, ships beside it on the two Linux
# musl legs, the only platforms it is for.
#
# Five legs. Four build natively on a runner of the target's own architecture
# and smoke-test what they built; the fifth (armv7, the 32-bit ARM gateways
# docs/EDGE_PROFILE.md is written for) has no hosted runner and is the one
# cross-compiled leg — see the `cross` matrix key and the comments on it.
name: Publish release binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to (e.g. v0.5.0)"
        required: true

permissions:
  contents: write # uploading release assets

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Job-level and an expression, on purpose: a `continue-on-error:` key
    # written inside a matrix entry is just another matrix variable and gates
    # nothing. The cross-compiled leg is the one allowed to fail — no hosted
    # runner is armv7, so its binary is run under emulation and not on the
    # hardware it is for — and a red armv7 must not strand the four native archives
    # behind `publish`'s `needs: build` (v0.5.1 shipped zero assets when one
    # leg hung). The four native legs stay required.
    continue-on-error: ${{ matrix.cross == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, not gnu: a statically linked binary runs on any distro,
          # including the minimal images an edge box tends to have. A glibc
          # build would inherit the builder's glibc floor and fail on anything
          # older, which is exactly the box least likely to be updatable.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm # native arm64; cross-linking musl is avoidable pain
            archive: tar.gz
          # 32-bit ARM, hard-float, static musl: the long tail of deployed
          # gateways (i.MX6/7, AM335x, a Raspberry Pi running a 32-bit OS) that
          # an arm64 binary cannot run on. There is no GitHub-hosted armv7
          # runner, so unlike every other leg this one is CROSS-COMPILED on
          # x86_64 with Zig as its C compiler and linker, and smoke-tested under
          # qemu. `cross: true` is what the toolchain step keys on, what the
          # build and the smoke test run differently by, and what the job's
          # `continue-on-error` reads — it is a matrix variable, not an
          # Actions keyword.
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            archive: tar.gz
            cross: true
          # No x86_64-apple-darwin. It was built on `macos-13`, which GitHub has
          # retired — and a `runs-on` label matching no runner does not fail, it
          # sits in `queued` until the 24h ceiling. On v0.5.1 that stranded the
          # four builds below, because `publish` needs the whole matrix, so the
          # release got zero assets instead of four.
          #
          # Dropped rather than repointed at an Intel image: Apple stopped
          # selling Intel Macs in 2023 and the runners are on their way out, so
          # repointing buys a target that breaks again on someone else's
          # schedule. Intel Mac users can `cargo install dagron`.
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust target
        run: rustup target add ${{ matrix.target }}

      # `cc` for the musl target, and nothing else: the binary links no OpenSSL
      # (rustls throughout) and bundles SQLite, so there is no system library to
      # find. Verified with `cargo tree --bin dagron`.
      #
      # `endsWith('-musl')` is deliberately NOT satisfied by the armv7 target
      # (`…-musleabihf`): Ubuntu's musl-tools is an x86_64 `musl-gcc` and would
      # produce x86_64 objects for the C in this build. The armv7 leg gets its
      # own cross toolchain in the next step instead.
      - name: musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # armv7 cross toolchain. A Rust target alone is not enough: two crates in
      # `dagron`'s graph compile C — libsqlite3-sys (the bundled SQLite) and
      # ring (the crypto under rustls) — so the leg needs an ARM C compiler,
      # archiver and musl libc. cargo-zigbuild gives it all three, from Zig,
      # which carries musl for every target it compiles for: `cargo zigbuild`
      # in place of `cargo build` is the whole wiring.
      #
      # Not musl.cc's prebuilt toolchain, which this leg used before: that host
      # never answers GitHub's runners (v0.11.0's leg timed out twice), so no
      # release had an armv7 archive. Zig comes from PyPI and cargo-zigbuild
      # from crates.io, both of which the other legs already depend on. The
      # wheel is pinned by sha256 and the crate by version and lockfile: a
      # toolchain is build input. qemu-user, from Ubuntu's archive, is for the
      # smoke test.
      - name: armv7 cross toolchain (Zig)
        if: matrix.cross
        run: |
          set -euo pipefail
          echo "ziglang==0.13.0.post1 --hash=sha256:5ff0f2cb0d583b4f94820909612043f62e4d1d9a8bed77ceec088a01fc2ef015" > /tmp/zig.txt
          python3 -m pip install --user --break-system-packages --only-binary :all: --require-hashes -r /tmp/zig.txt
          python3 -m ziglang version
          cargo install cargo-zigbuild --locked --version 0.20.1
          sudo apt-get update && sudo apt-get install -y qemu-user

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      # The release's version, compiled into each binary for `--version`: the
      # tag without its `v`.
      - name: Resolve version
        id: appver
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # --locked so a release binary is built from the committed lockfile and
      # not from whatever resolved that morning. Default features = sqlite +
      # ops: the embedded datastore and the management API, which is what
      # `dagron dev` needs and what a single-binary deployment means.
      - name: Build
        env:
          APP_VERSION: ${{ steps.appver.outputs.version }}
        run: cargo ${{ matrix.cross && 'zigbuild' || 'build' }} --release --locked --bin dagron --target ${{ matrix.target }}
      # The step runner goes into whatever image a CI task uses, so it is
      # static: musl, x86_64 and arm64, each built natively like `dagron`.
      - name: Build dagron-ci-exec
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        env:
          APP_VERSION: ${{ steps.appver.outputs.version }}
        # -p, not --bin: this workspace's root is a package, so a bare --bin
        # looks in `dagron` alone and finds no such binary.
        run: cargo build --release --locked -p dagron-ci-exec -p dagron-ci-cache --target ${{ matrix.target }}

      # The remote runner: a BYO runner for a Mac, a Windows host, an arm64
      # box, which dials the API and holds no database credentials. On every
      # native leg; not the cross-compiled armv7 one, which it is not
      # promised for.
      - name: Build dagron-runner
        if: ${{ !matrix.cross }}
        env:
          APP_VERSION: ${{ steps.appver.outputs.version }}
        run: cargo build --release --locked -p dagron-runner --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          name="dagron-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/dagron" "dist/$name/"
          # Licence travels with the binary; someone who downloads only this
          # tarball should still have it.
          cp LICENSE "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          echo "ASSET=dist/${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          name="dagron-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/dagron.exe" "dist/$name/"
          cp LICENSE "dist/$name/" 2>/dev/null || true
          (cd dist && 7z a "${name}.zip" "$name" >/dev/null)
          echo "ASSET=dist/${name}.zip" >> "$GITHUB_ENV"

      # Runs the binary that is about to be published, on the machine that built
      # it. Catches the failure that matters most and is easiest to ship: an
      # archive containing something that does not start.
      # The four native legs can do this — ubuntu-latest and windows-latest are
      # x86_64, macos-latest and ubuntu-24.04-arm are arm64 — so each of those
      # runners executes what it just built. The armv7 leg cannot: it is
      # cross-compiled on x86_64, so it runs its binary under user-mode qemu.
      # The binary is static, so `qemu-arm` runs it with no ARM libraries and
      # no binfmt registration.
      - name: Smoke test
        shell: bash
        env:
          APP_VERSION: ${{ steps.appver.outputs.version }}
          RUN: ${{ matrix.cross && 'qemu-arm' || '' }}
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/dagron"
          # Note: not `[ -f "$bin.exe" ] && bin=...` — under `set -e` a false
          # test would end the step, which is every non-Windows target.
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          # It says which release it is, on one line, and starts nothing.
          said=$($RUN "$bin" --version | tr -d '\r')
          if [ "$said" != "dagron $APP_VERSION" ]; then
            echo "::error::--version says '$said', not 'dagron $APP_VERSION'"
            exit 1
          fi
          # `validate` parses, expands and graph-checks a spec with no server
          # and no network — the cheapest end-to-end proof the binary runs.
          $RUN "$bin" validate examples/simple_dag.yaml
          echo "smoke test passed for ${{ matrix.target }}"
      # It says which release it is, and on musl it is static: it is copied
      # onto hosts and into images that have nothing else.
      - name: Smoke test dagron-runner
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          APP_VERSION: ${{ steps.appver.outputs.version }}
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/dagron-runner"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          said=$("$bin" --version | tr -d '\r')
          if [ "$said" != "dagron-runner $APP_VERSION" ]; then
            echo "::error::--version says '$said', not 'dagron-runner $APP_VERSION'"
            exit 1
          fi
          case "${{ matrix.target }}" in
            *-musl)
              if readelf -l "$bin" | grep -q INTERP; then
                echo "dagron-runner is dynamically linked"
                exit 1
              fi ;;
          esac
          # With nothing set it refuses to start, and says what it needs.
          if "$bin" run 2>err.txt; then
            echo "::error::dagron-runner started with no DAGRON_RUNNER_URL"
            exit 1
          fi
          grep -q DAGRON_RUNNER_URL err.txt
          echo "dagron-runner smoke test passed for ${{ matrix.target }}"
      - name: Package dagron-runner
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          name="dagron-runner-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release/dagron-runner"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          cp "$bin" "dist/$name/"
          cp LICENSE "dist/$name/" 2>/dev/null || true
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd dist && 7z a "${name}.zip" "$name" >/dev/null)
            echo "RUNNER_ASSET=dist/${name}.zip" >> "$GITHUB_ENV"
          else
            tar -C dist -czf "dist/${name}.tar.gz" "$name"
            echo "RUNNER_ASSET=dist/${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      # Static, and it runs a step: an ELF naming an interpreter (a dynamic
      # loader) would fail in the minimal images it is copied into.
      - name: Smoke test dagron-ci-exec
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/dagron-ci-exec"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "dagron-ci-exec is dynamically linked"
            exit 1
          fi
          out=$(env -i PATH="$PATH" CI_STEP_PROTOCOL=1 CI_STEP_COUNT=1 \
            CI_STEP_1_RUN='echo ok' "$bin" 2>/dev/null)
          test "$out" = ok
          "$bin" --speaks 1
          # Its cache tool goes with it, static too (zstd and ring are C).
          cache="target/${{ matrix.target }}/release/dagron-ci-cache"
          if readelf -l "$cache" | grep -q INTERP; then
            echo "dagron-ci-cache is dynamically linked"
            exit 1
          fi
          "$cache" --version
          echo "dagron-ci-exec smoke test passed for ${{ matrix.target }}"
      - name: Package dagron-ci-exec
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          name="dagron-ci-exec-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/dagron-ci-exec" "dist/$name/"
          cp "target/${{ matrix.target }}/release/dagron-ci-cache" "dist/$name/"
          cp LICENSE "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          echo "EXEC_ASSET=dist/${name}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        with:
          name: dagron-ci-exec-${{ matrix.target }}
          path: ${{ env.EXEC_ASSET }}
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !matrix.cross }}
        with:
          name: dagron-runner-${{ matrix.target }}
          path: ${{ env.RUNNER_ASSET }}
          if-no-files-found: error

  # A CycloneDX SBOM of each binary: what its build links, from the lockfile
  # the release was built with. One job and not one a leg: the dependencies
  # are the lockfile's on every platform but for the few a target adds, and
  # this says what the Linux build has.
  sbom:
    name: SBOMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx --version 0.5.9

      - name: Write them
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # A file beside each crate that builds a binary; the three that are
          # published are kept, under the names their archives have.
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries --no-build-deps
          mkdir -p dist
          cp dagron_bin.cdx.json "dist/dagron-${VERSION}.cdx.json"
          cp crates/dagron-ci-exec/dagron-ci-exec_bin.cdx.json "dist/dagron-ci-exec-${VERSION}.cdx.json"
          cp crates/dagron-runner/dagron-runner_bin.cdx.json "dist/dagron-runner-${VERSION}.cdx.json"
          for sbom in dist/*.cdx.json; do
            jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$sbom" > /dev/null \
              || { echo "::error::$sbom is not an SBOM with components"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/*.cdx.json
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploading release assets
      # What is attached is signed with this workflow's own identity, which
      # GitHub vouches for with a short-lived token: there is no key to keep.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # One checksum file over every archive, so a download can be verified
      # without trusting the transport. Generated here rather than per-job so
      # the file covers the whole set.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          # Written outside the directory first: `sha256sum * > SHA256SUMS`
          # creates the empty target before the glob expands, so the file ends
          # up hashing itself.
          sha256sum dagron-* > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Install cosign
        # The installer and the release it installs are the pair this
        # repository's other signed release pins: v4.1.0 is the first
        # installer that can check a cosign v3 download.
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: "v3.1.3"

      # One signature over the checksums covers every file they list. And
      # for each file, a statement of where it was built (SLSA provenance),
      # signed the same way. Keyless: each certificate says which repository,
      # workflow, ref and commit signed, and each signing is recorded in a
      # public log. The statement is written here, by the workflow that built
      # the files; what vouches for it is that certificate.
      - name: Sign the checksums, and say where each file was built
        run: |
          set -euo pipefail
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          jq -n --arg repo "$repo" --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg event "$GITHUB_EVENT_NAME" '{
              buildDefinition: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: {
                  workflow: { ref: $ref, repository: $repo, path: ".github/workflows/binaries.yml" }
                },
                internalParameters: { github: { event_name: $event, runner_environment: "github-hosted" } },
                resolvedDependencies: [
                  { uri: ("git+" + $repo + "@" + $ref), digest: { gitCommit: $sha } }
                ]
              },
              runDetails: {
                builder: { id: ($repo + "/.github/workflows/binaries.yml@" + $ref) },
                metadata: { invocationId: ($repo + "/actions/runs/" + $run + "/attempts/" + $attempt) }
              }
            }' > "$RUNNER_TEMP/provenance.json"
          cd dist
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          # The names as the checksums list them: every file but what is
          # written here.
          awk '{print $2}' SHA256SUMS > "$RUNNER_TEMP/files"
          while read -r file; do
            cosign attest-blob --yes --type slsaprovenance1 \
              --predicate "$RUNNER_TEMP/provenance.json" \
              --bundle "$file.provenance.sigstore.json" "$file"
          done < "$RUNNER_TEMP/files"

      # What a user would run, run here before anything is attached.
      - name: Verify what was signed
        run: |
          set -euo pipefail
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/binaries.yml@$GITHUB_REF"
          issuer=https://token.actions.githubusercontent.com
          cd dist
          cosign verify-blob --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" \
            --bundle SHA256SUMS.sigstore.json SHA256SUMS
          sha256sum -c SHA256SUMS
          while read -r file; do
            cosign verify-blob-attestation --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" --type slsaprovenance1 \
              --bundle "$file.provenance.sigstore.json" "$file" > /dev/null
          done < "$RUNNER_TEMP/files"
          echo "verified: the checksums' signature, and the provenance of $(wc -l < "$RUNNER_TEMP/files") files"

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          # --clobber so re-running a dispatch replaces assets rather than
          # failing halfway and leaving a release with a partial set.
          gh release upload "$version" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached $(ls dist | wc -l) assets to $version"
