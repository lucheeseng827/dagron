# Build + push the official multi-arch dagron OSS images AND the OCI Helm chart to
# Docker Hub (docker.io/mancube/dagron-engine, -api, -frontend, and the chart at
# oci://registry-1.docker.io/mancube/dagron). Active in the PUBLIC MIRROR
# (lucheeseng827/dagron); inert in the monorepo (the Dockerfiles/Cargo.lock/chart
# it builds only exist in the mirrored cut, and the monorepo never carries the
# stamped `v*.*.*` tag this fires on).
#
# This is the dagron twin of mergestro-gate's mirror-native publish
# the release path builds the images IN this repo, from this source, rather than
# pushing them in from elsewhere. Only the OSS images are built here; commercial
# add-on images are published separately and their sources are not part of this
# repository.
#
# Requires two secrets in the mirror's `cicd` environment (same names as the
# monorepo release):
#   DOCKER_USERNAME — a Docker Hub user with push access to the mancube org
#   DOCKER_PASSWORD — a Docker Hub access token (Read/Write on mancube/dagron-*)
#
# Fires automatically on the full-semver version tags the OSS sync stamps on the
# mirror (`v0.3.0` → mancube/dagron-<img>:0.3.0 + :0.3 + :latest; a prerelease
# like `v0.3.0-rc.1` publishes the version tags but not :latest). Manual dispatch
# takes an explicit tag.
#
# Each architecture builds NATIVELY — amd64 on ubuntu-latest, arm64 on GitHub's
# free-for-public-repos arm runners — then a per-image merge job stitches one
# multi-arch manifest. No QEMU (the emulated arm64 Rust build is punishingly slow).

name: Publish Docker images + Helm chart

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.3.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # One entry per OSS image. `context`/`file`/`build_args` are relative to
        # the mirror repo root (= the module_54 cut).
        #
        # The engine's FEATURES, and what each is for:
        #   postgres,ops       the datastore of a deployment, and the ops API;
        #   kubernetes         tasks as pods;
        #   otel               OTLP span delivery (off until
        #                      OTEL_EXPORTER_OTLP_ENDPOINT names a collector) and
        #                      a W3C trace context in each task's environment;
        #   archive-s3,-gcs,-azure
        #                      the object stores a run archive can go to
        #                      (GC_ARCHIVE_URL): S3 and what speaks it, Google
        #                      Cloud Storage, Azure Blob.
        # The last four were source-build features before: an operator who
        # wanted a bucket or a collector had to build an image of their own.
        #
        # These lines are the one place the sets are written.
        # scripts/published-features.sh reads them from here and CI compiles
        # both binaries that way, so that a tag is not the first build of them.
        # Both engine entries name the same set, and that script refuses two.
        image:
          - name: dagron-engine
            context: "."
            file: "./Dockerfile"
            build_args: "FEATURES=postgres,ops,kubernetes,otel,archive-s3,archive-gcs,archive-azure"
          # The same engine, built from the `localdev` stage (debian-slim)
          # instead of distroless.
          #
          # With EXECUTOR=local a task's command runs as a subprocess *inside
          # this container*, so the distroless image above — which has no shell
          # and no coreutils — can run no local task at all. It is correct for
          # docker/kubernetes execution, where the command runs in the task's
          # own image, and unusable for the single-box quickstart where a first
          # workflow is `echo`.
          #
          # Publishing both is what lets compose.quickstart.yaml pull rather
          # than build. NOT for production: it exists to make `echo` resolve.
          - name: dagron-engine-localdev
            context: "."
            file: "./Dockerfile"
            target: "localdev"
            build_args: "FEATURES=postgres,ops,kubernetes,otel,archive-s3,archive-gcs,archive-azure"
          # dagron-api reads what the engine wrote, so it carries the same
          # three object stores: for archived runs (GC_ARCHIVE_URL) and for
          # the artifact store (DAGRON_ARTIFACT_URL). `otel` delivers the
          # spans it opens, under the same variable as the engine's.
          - name: dagron-api
            context: "."
            file: "./crates/dagron-api/Dockerfile"
            build_args: "CARGO_FEATURES=otel,archive-s3,archive-gcs,archive-azure"
          # `dagron-frontend` used to be built here. It is gone as of 0.9.1, one
          # minor earlier than the removal that was announced, because the
          # image cannot be built at all any more — let alone usefully:
          #
          #   * `frontend/next.config.js` sets `output: "export"` so dagron-api can
          #     embed the console, and an export build emits `out/`, never
          #     `.next/standalone`. The old Dockerfile copied the latter.
          #   * Pointing it at `out/` would not save it. `BASE = "/api"` in
          #     `src/lib/dagron-api.ts` is relative and the `/api` rewrite is gone
          #     (it buffered `text/event-stream` and broke live updates). A console
          #     served on :3000 by anything other than dagron-api 404s every call.
          #
          # Publishing a tag that builds into a dead console is worse than not
          # publishing one. 0.8.1 remains the last working `mancube/dagron-frontend`.
          - name: dagron-mcp
            context: "."
            file: "./crates/dagron-mcp/Dockerfile"
            build_args: ""
          # The GitOps worker (#721). The one image that intentionally carries a
          # `git` binary — which is why it is a separate deployable and why
          # dagron-api stays distroless. Deploy it only if you connect repos.
          - name: dagron-gitops
            context: "."
            file: "./crates/dagron-gitops/Dockerfile"
            build_args: ""
          # The MCP-tool *step* — a task binary, not a service. docs/MCP.md
          # tells readers to write `command: ["dagron-step-mcp"]`, and until it
          # was added here that binary shipped in no image and no release asset,
          # so the one command the docs hand a reader was the one thing nothing
          # delivered. Normally consumed as a COPY --from into a task's own
          # image; see crates/dagron-step-mcp/Dockerfile.
          - name: dagron-step-mcp
            context: "."
            file: "./crates/dagron-step-mcp/Dockerfile"
            build_args: ""
          # The two `defer:` step binaries. Both images carry every backend
          # their crate can build, while the crates default to the lean set —
          # one image that submits anywhere beats three a user must choose
          # between, and a source build vendoring the binary should not be made
          # to carry a Kubernetes client or a wire driver it will never use.
          - name: dagron-step-spark
            context: "."
            file: "./crates/dagron-step-spark/Dockerfile"
            build_args: ""
          - name: dagron-step-sql
            context: "."
            file: "./crates/dagron-step-sql/Dockerfile"
            build_args: ""
          # The step runner of a dagron-ci task, on scratch: the image an
          # engine names in DAGRON_CI_EXEC_IMAGE, whose init container installs
          # the static binary into every task with a workspace.
          - name: dagron-ci-exec
            context: "."
            file: "./crates/dagron-ci-exec/Dockerfile"
            build_args: ""
          # dagron-ci, the CI service: a forge's events in, runs in dagron-api,
          # commit statuses back. The chart deploys it with `ci.enabled`.
          # otel: its log records and its metrics over OTLP, off until
          # OTEL_EXPORTER_OTLP_ENDPOINT names a collector, as the engine's.
          - name: dagron-ci
            context: "."
            file: "./crates/dagron-ci/Dockerfile"
            build_args: "CI_FEATURES=otel"
          # The remote runner, static, on distroless: the in-cluster
          # controller whose tasks are pods, or a runner beside a Docker
          # daemon; and `dagron-runner scale`, its autoscaler.
          - name: dagron-runner
            context: "."
            file: "./crates/dagron-runner/Dockerfile"
            build_args: ""
        arch: [amd64, arm64]
        # `arch` is a real matrix axis, so these includes attach the platform +
        # runner to each (image × arch) combination rather than adding new legs.
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # DOCKER_USERNAME / DOCKER_PASSWORD live in the 'cicd' environment.
    environment: cicd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The version is compiled into every binary, and the frontend bakes it
      # into its bundle (the standalone server can't read it at runtime), so
      # the build job needs it too — the `ver` step in the merge job below
      # runs too late for this.
      - name: Resolve version
        id: appver
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$DISPATCH_TAG"; else V="$GITHUB_REF_NAME"; fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      # Push by digest only — the merge job below owns the human-readable tags.
      - name: Build + push ${{ matrix.image.name }} (${{ matrix.platform }}, native)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          # Empty for every image but the localdev engine, which means "build
          # the final stage" — the existing behaviour.
          target: ${{ matrix.image.target }}
          # Every image declares ARG APP_VERSION: its binary answers
          # `--version` with it, and dagron-api's image stamps the console it
          # embeds with it too. Until 0.9.1 it went to the deprecated frontend
          # image alone, and the console inside every published dagron-api said
          # "dev"; until the binaries read it, each said its crate's 0.1.0.
          build-args: |
            ${{ matrix.image.build_args }}
            APP_VERSION=${{ steps.appver.outputs.version }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=docker.io/mancube/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          # An SBOM (SPDX) and SLSA provenance, made by BuildKit and attached
          # to what is pushed. Each platform's push is then an index of the
          # image and its attestations, and the merge below keeps them. The
          # signature is over the merged index, so it covers them too.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=docker-${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.image.name }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # `__` separates image from arch: with a single dash,
          # `digest-dagron-engine-*` also matches
          # `digest-dagron-engine-localdev-amd64`, and the plain engine
          # manifest would be built from the wrong digests.
          name: digest-${{ matrix.image.name }}__${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    environment: cicd
    permissions:
      contents: read
      # The image is signed with this workflow's own identity, which GitHub
      # vouches for with a short-lived token: there is no signing key to keep.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [dagron-engine, dagron-engine-localdev, dagron-api, dagron-mcp, dagron-gitops, dagron-step-mcp, dagron-step-spark, dagron-step-sql, dagron-ci-exec, dagron-ci, dagron-runner]
    steps:
      - name: Collect this image's per-arch digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}__*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: mancube/${{ matrix.image }}
          # latest=auto → stable semver tags also tag :latest; prereleases don't.
          # Manual dispatch uses the supplied raw tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'docker.io/mancube/${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect published image
        run: docker buildx imagetools inspect "docker.io/mancube/${{ matrix.image }}:${{ steps.meta.outputs.version }}"

      - name: Install cosign
        # The installer and the release it installs are the pair this
        # repository's other signed release pins: v4.1.0 is the first
        # installer that can check a cosign v3 download.
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: "v3.1.3"

      # Signed by its digest, never by a tag: a tag can be moved, and a
      # signature of one would then be a signature of whatever it names.
      # Keyless: the certificate says which repository, workflow and ref
      # signed, and the signing is recorded in a public log.
      - name: Sign the image
        id: sign
        env:
          IMAGE: docker.io/mancube/${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no digest for $IMAGE:$VERSION"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          cosign sign --yes "$IMAGE@$digest"

      # What a user would run, run here: a release whose signature does not
      # verify, or that lost its SBOM or provenance in the merge, fails
      # where it is made.
      - name: Verify the signature, the SBOM and the provenance
        env:
          IMAGE: docker.io/mancube/${{ matrix.image }}
          DIGEST: ${{ steps.sign.outputs.digest }}
        run: |
          set -euo pipefail
          # Docker Hub can take a while to list a signature it has just
          # taken: v0.11.0's merges failed "no signatures found" seconds after
          # the push, and verified when checked later. A signature that is
          # not there still fails, a minute on.
          for try in 1 2 3 4 5 6 7; do
            if cosign verify "$IMAGE@$DIGEST" \
              --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/docker.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null; then
              break
            fi
            if [ "$try" = 7 ]; then exit 1; fi
            sleep 10
          done
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .SBOM}}' \
            | jq -e '[.. | objects | select(has("SPDX"))] | length > 0' > /dev/null \
            || { echo "::error::$IMAGE@$DIGEST carries no SBOM"; exit 1; }
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Provenance}}' \
            | jq -e '[.. | objects | select(has("SLSA"))] | length > 0' > /dev/null \
            || { echo "::error::$IMAGE@$DIGEST carries no provenance"; exit 1; }
          echo "$IMAGE@$DIGEST: signed, with an SBOM and provenance"

  # Package + push the OSS Helm chart (OCI) after the images exist, so a single v*
  # tag publishes the whole stack from the mirror. The mirror's charts/dagron is
  # already the OSS cut — it carries no operator.yaml or crds — but the seatbelt
  # below re-checks before pushing.
  chart:
    needs: merge
    runs-on: ubuntu-latest
    environment: cicd
    permissions:
      contents: read
      id-token: write # the chart is signed as the images are
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Resolve version
        id: ver
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            V="$DISPATCH_TAG"
          else
            V="${GITHUB_REF_NAME#v}"   # refs/tags/v0.3.0 -> 0.3.0
          fi
          V="${V#v}"   # normalize a leading v (workflow_dispatch input may include one)
          # $V is interpolated into sed replacements below (values.yaml, Chart.yaml);
          # reject anything that isn't a plain semver so a stray `&`/`\`/typo can't
          # corrupt the substitution instead of failing loudly here.
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a valid semver: $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "chart version $V"

      - name: Package + push Helm chart (OCI)
        id: push
        env:
          V: ${{ steps.ver.outputs.version }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$DOCKER_PASSWORD" | \
            helm registry login registry-1.docker.io -u "$DOCKER_USERNAME" --password-stdin
          # Keep the packaged chart's default image tags in lockstep with $V so a
          # vX.Y.Z chart pulls vX.Y.Z images (not a stale tag).
          sed -i -E "s#^([[:space:]]*image: [^[:space:]]+/dagron-[a-z]+:).*#\1${V}#" \
            charts/dagron/values.yaml
          # Same lockstep for the Artifact Hub `artifacthub.io/images` annotation
          # tags in Chart.yaml (mancube/dagron-<name>:<semver> -> $V), so the
          # listed images match the release.
          sed -i -E "s#(mancube/dagron-[a-z]+:)[0-9]+\.[0-9]+\.[0-9]+#\1${V}#g" \
            charts/dagron/Chart.yaml
          helm package charts/dagron --version "$V" --app-version "$V" -d dist
          # Seatbelt: refuse to publish if a closed operator/CRD manifest is present.
          if tar -tzf "dist/dagron-$V.tgz" | grep -E 'templates/operator\.yaml|/crds/'; then
            echo "::error::closed operator/CRD manifest present in OSS chart package — refusing to push"
            exit 1
          fi
          # helm says the digest it pushed on a line of its own.
          helm push "dist/dagron-$V.tgz" "oci://registry-1.docker.io/mancube" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest=$(sed -n 's/^Digest: *\(sha256:[0-9a-f]\{64\}\)$/\1/p' "$RUNNER_TEMP/push.log")
          if [ -z "$digest" ]; then
            echo "::error::helm push did not say what digest it pushed"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed oci://registry-1.docker.io/mancube/dagron:$V ($digest)"

      # cosign reads the registry's credentials where docker keeps them;
      # helm keeps its own.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install cosign
        # The installer and the release it installs are the pair this
        # repository's other signed release pins: v4.1.0 is the first
        # installer that can check a cosign v3 download.
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: "v3.1.3"

      - name: Sign the chart, and verify it
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "docker.io/mancube/dagron@$DIGEST"
          # As for the images: Docker Hub lists a new signature late.
          for try in 1 2 3 4 5 6 7; do
            if cosign verify "docker.io/mancube/dagron@$DIGEST" \
              --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/docker.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null; then
              break
            fi
            if [ "$try" = 7 ]; then exit 1; fi
            sleep 10
          done
          echo "docker.io/mancube/dagron@$DIGEST: signed"
