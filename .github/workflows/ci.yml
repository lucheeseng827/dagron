# Pull-request CI for the PUBLIC MIRROR (lucheeseng827/dagron); inert in the
# monorepo, whose only active workflows live in the repo-root `.github/workflows`.
# Same arrangement as docker.yml and binaries.yml alongside it.
#
# Why this exists: CONTRIBUTING.md tells contributors "CI runs fmt, clippy, build,
# and test on every PR", and until this file the mirror carried only the two
# tag-triggered publish workflows — so a contributor's PR sat with no checks at all
# and neither side could tell whether the change even compiled. The monorepo gates
# the same commands before publishing, but that runs after the fact, in a private
# repo the contributor cannot see.
#
# NOTE FOR CONTRIBUTORS: a green run here is the signal that a maintainer can take
# the change. Merging happens in the upstream source tree this repository is
# published from, and the PR is then closed with a pointer to the commit that
# carries it — see CONTRIBUTING.md. Nothing is lost when that happens.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build · test (required) · fmt · clippy (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # ADVISORY, not required — and deliberately so. rustfmt is the reason: measured
      # on the v0.8.0 tree it reports 955 diffs, because there is no rustfmt.toml and
      # it is comparing against a style this code was never written in. That is
      # nothing a contributor introduced or can fix in their PR, so gating on it would
      # paint every incoming PR red on arrival — worse than no signal, because it
      # teaches everyone to ignore the X. It runs here so the baseline stays visible.
      #
      # CLIPPY IS A DIFFERENT STORY, and the numbers this comment used to carry were
      # wrong. It claimed "3 findings in dagron-core". The v0.8.0 run — the first time
      # this workflow had ever executed — found exactly one, in a different crate: a
      # `bool_assert_comparison` on a test line in dagron-crypto, now fixed. Whatever
      # else clippy has to say is still UNMEASURED, because the step runs under
      # `set -euo pipefail`: the first `cargo clippy` aborted on that one finding, so
      # the second command (dagron-api + dagron-gitops) never ran at all, and sibling
      # crates in the first invocation were still checking when it bailed.
      #
      # So the next green-or-not clippy run here is the real measurement. If it comes
      # back clean, promoting clippy costs one line: drop its `continue-on-error`.
      # rustfmt stays advisory until someone lands a `rustfmt.toml` capturing the style
      # actually in use and reformats in one commit.
      - name: Format (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      # This workspace CANNOT be built as one unit, by design: dagron-core compiles
      # exactly one sqlx backend (compile_error! otherwise), the engine wants sqlite,
      # and dagron-api/dagron-gitops want postgres. `--workspace` unifies features,
      # enables both, and fails to compile — so each step covers the two feature
      # worlds separately, which is also how the images are actually built. Every
      # member is covered exactly once; a new member that picks postgres belongs in
      # the second command of each pair.
      #
      # A third command covers the `mqtt` feature world. `SOURCE=mqtt` is behind a
      # non-default Cargo feature, so neither command above ever compiles that
      # module: without this line a broken MQTT source is invisible to CI, and the
      # first person to find out is whoever builds `--features mqtt`.
      - name: Clippy (advisory — see the note above)
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --exclude dagron-api --exclude dagron-gitops \
            --all-targets -- -D warnings
          cargo clippy --locked -p dagron-api -p dagron-gitops --all-targets -- -D warnings
          cargo clippy --locked -p dagron-source --features mqtt,sqlite --all-targets -- -D warnings
          # BOTH worlds for each step crate. The feature legs alone are not
          # enough: an import used only by a feature-gated function is dead in
          # the default build and invisible to a lint that only ever runs with
          # the feature on — which is exactly how one reached main.
          cargo clippy --locked -p dagron-step-spark --all-targets -- -D warnings
          cargo clippy --locked -p dagron-step-spark --features k8s --all-targets -- -D warnings
          cargo clippy --locked -p dagron-step-sql --all-targets -- -D warnings
          cargo clippy --locked -p dagron-step-sql --features mysql,postgres --all-targets -- -D warnings
          # The Kubernetes pod executor. Non-default, and until 0.10.0 it was
          # covered by NO leg at all — not clippy, not test, not MSRV — while
          # being one of the three ways a task actually runs. `dagron-core/sqlite`
          # rides along because dagron-core needs exactly one DB backend and this
          # crate does not pick one itself.
          cargo clippy --locked -p dagron-executor --features kubernetes,dagron-core/sqlite --all-targets -- -D warnings

      # --locked, so a PR that edits a Cargo.toml without refreshing Cargo.lock fails
      # here with a clear message rather than drifting the published lockfile.
      - name: Build (required)
        run: |
          set -euo pipefail
          cargo build --locked --workspace --exclude dagron-api --exclude dagron-gitops
          cargo build --locked -p dagron-api -p dagron-gitops

      - name: Test (required)
        run: |
          set -euo pipefail
          cargo test --locked --workspace --exclude dagron-api --exclude dagron-gitops
          cargo test --locked -p dagron-api -p dagron-gitops
          # The mqtt feature world (see the clippy note): feature-gated code that
          # no default build compiles, together with its tests.
          cargo test --locked -p dagron-source --features mqtt,sqlite
          # The step binaries' non-default backends, for exactly the reason the
          # mqtt leg above exists: a feature no default build compiles is a
          # feature whose breakage is invisible until someone builds the image.
          # step-spark's `k8s` is the Kubernetes client; step-sql's two wire
          # features are what its published image is built with.
          cargo test --locked -p dagron-step-spark --features k8s
          cargo test --locked -p dagron-step-sql --features mysql,postgres
          # The Kubernetes pod executor — see the clippy note. It compiles
          # without a cluster, so the manifest-shaping and label tests run here
          # even though nothing connects to an apiserver.
          cargo test --locked -p dagron-executor --features kubernetes,dagron-core/sqlite

  msrv:
    name: MSRV (required) — the declared rust-version actually builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the `rust-version` every manifest declares. A declared MSRV
      # nothing compiles against is a claim, not a guarantee: it rots the first
      # time anyone uses a newer language feature or bumps a dependency whose own
      # floor moved, and the person who finds out is a packager on a distro
      # toolchain. docs/RELEASE.md §2 asks for exactly this pairing — "declare
      # `rust-version` in each `Cargo.toml`; test it in CI".
      #
      # 1.88 is measured, not chosen: the tree builds at 1.88 and fails at 1.86,
      # where serde_with 3.21 stops building. Keep this in lockstep with the
      # manifests — if you bump one, this job is what tells you about the other.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv

      # `check`, not `build`: this job answers "does it compile on the oldest
      # toolchain we promise", and codegen adds minutes without changing that
      # answer. The same three legs the required build covers, for the same
      # reasons — the two Postgres-only crates resolve a different backend, and
      # the mqtt feature world is compiled by no default build.
      # No working-directory: this file is mirrored to the public repo, where
      # the module's contents ARE the repo root. That is why no other step here
      # sets one either.
      - name: cargo check on the declared MSRV
        run: |
          set -euo pipefail
          cargo check --locked --workspace --exclude dagron-api --exclude dagron-gitops
          cargo check --locked -p dagron-api -p dagron-gitops
          cargo check --locked -p dagron-source --features mqtt,sqlite
          # The step crates' published feature worlds. `--workspace` above
          # includes both crates but resolver 2 does not activate a feature
          # across packages, and both declare `default = []` — so without these
          # two lines the MSRV job compiles neither the Kubernetes client nor
          # the sqlx wire drivers, which is exactly what the images are built
          # from. A dependency could raise the effective MSRV for a published
          # image without any required job going red.
          cargo check --locked -p dagron-step-spark --features k8s
          cargo check --locked -p dagron-step-sql --features mysql,postgres
          cargo check --locked -p dagron-executor --features kubernetes,dagron-core/sqlite
