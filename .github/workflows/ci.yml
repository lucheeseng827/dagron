# Pull-request CI for the PUBLIC MIRROR (lucheeseng827/dagron); inert in the
# monorepo, whose only active workflows live in the repo-root `.github/workflows`.
# Same arrangement as docker.yml and binaries.yml alongside it.
#
# Why this exists: CONTRIBUTING.md tells contributors "CI runs fmt, clippy, build,
# and test on every PR", and until this file the mirror carried only the two
# tag-triggered publish workflows — so a contributor's PR sat with no checks at all
# and neither side could tell whether the change even compiled. The monorepo gates
# the same commands before publishing, but that runs after the fact, in a private
# repo the contributor cannot see.
#
# NOTE FOR CONTRIBUTORS: a green run here is the signal that a maintainer can take
# the change. Merging happens in the upstream source tree this repository is
# published from, and the PR is then closed with a pointer to the commit that
# carries it — see CONTRIBUTING.md. Nothing is lost when that happens.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build · test (required) · fmt · clippy (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # ADVISORY, not required — and deliberately so. rustfmt is the reason: measured
      # on the v0.8.0 tree it reports 955 diffs, because there is no rustfmt.toml and
      # it is comparing against a style this code was never written in. That is
      # nothing a contributor introduced or can fix in their PR, so gating on it would
      # paint every incoming PR red on arrival — worse than no signal, because it
      # teaches everyone to ignore the X. It runs here so the baseline stays visible.
      #
      # CLIPPY IS A DIFFERENT STORY, and the numbers this comment used to carry were
      # wrong. It claimed "3 findings in dagron-core". The v0.8.0 run — the first time
      # this workflow had ever executed — found exactly one, in a different crate: a
      # `bool_assert_comparison` on a test line in dagron-crypto, now fixed. Whatever
      # else clippy has to say is still UNMEASURED, because the step runs under
      # `set -euo pipefail`: the first `cargo clippy` aborted on that one finding, so
      # the second command (dagron-api + dagron-gitops) never ran at all, and sibling
      # crates in the first invocation were still checking when it bailed.
      #
      # So the next green-or-not clippy run here is the real measurement. If it comes
      # back clean, promoting clippy costs one line: drop its `continue-on-error`.
      # rustfmt stays advisory until someone lands a `rustfmt.toml` capturing the style
      # actually in use and reformats in one commit.
      - name: Format (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      # This workspace CANNOT be built as one unit, by design: dagron-core compiles
      # exactly one sqlx backend (compile_error! otherwise), the engine wants sqlite,
      # and dagron-api/dagron-gitops want postgres. `--workspace` unifies features,
      # enables both, and fails to compile — so each step covers the two feature
      # worlds separately, which is also how the images are actually built. Every
      # member is covered exactly once; a new member that picks postgres belongs in
      # the second command of each pair.
      #
      # A third command covers the `mqtt` feature world. `SOURCE=mqtt` is behind a
      # non-default Cargo feature, so neither command above ever compiles that
      # module: without this line a broken MQTT source is invisible to CI, and the
      # first person to find out is whoever builds `--features mqtt`.
      - name: Clippy (advisory — see the note above)
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --exclude dagron-api --exclude dagron-gitops \
            --all-targets -- -D warnings
          cargo clippy --locked -p dagron-api -p dagron-gitops --all-targets -- -D warnings
          cargo clippy --locked -p dagron-source --features mqtt,sqlite --all-targets -- -D warnings

      # --locked, so a PR that edits a Cargo.toml without refreshing Cargo.lock fails
      # here with a clear message rather than drifting the published lockfile.
      - name: Build (required)
        run: |
          set -euo pipefail
          cargo build --locked --workspace --exclude dagron-api --exclude dagron-gitops
          cargo build --locked -p dagron-api -p dagron-gitops

      - name: Test (required)
        run: |
          set -euo pipefail
          cargo test --locked --workspace --exclude dagron-api --exclude dagron-gitops
          cargo test --locked -p dagron-api -p dagron-gitops
          # The mqtt feature world (see the clippy note): feature-gated code that
          # no default build compiles, together with its tests.
          cargo test --locked -p dagron-source --features mqtt,sqlite
