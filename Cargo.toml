# Workspace root. The `dagron` engine binary is the root package; the library
# crates are members so the whole module shares one Cargo.lock + target dir.
[workspace]
members = ["crates/dagron-core", "crates/dagron-executor", "crates/dagron-source", "crates/dagron-engine", "crates/dagron-api", "crates/dagron-identity", "crates/dagron-artifact", "crates/dagron-crypto", "crates/dagron-mcp", "crates/dagron-import", "crates/dagron-plan", "crates/dagron-lineage", "crates/dagron-forge", "crates/dagron-logging", "crates/dagron-gitops", "crates/dagron-step-mcp", "crates/dagron-step-spark", "crates/dagron-step-sql", "crates/dagron-autopsy", "crates/dagron-state", "crates/dagron-ci", "crates/dagron-ci-exec", "crates/dagron-ci-expr", "crates/dagron-ci-cache", "crates/dagron-runner"]
# The enterprise build's sibling directory (its own separate workspace, not
# present here) is excluded so this workspace always builds standalone.
#
# `crates/dagron-gitops` is also excluded: it is a Postgres-only optional worker
# image, so its `dagron-core/postgres` dependency would unify with this
# workspace's default `sqlite` backend under `cargo build --workspace` and trip
# `dagron-core`'s "exactly one DB backend" `compile_error!`. It builds standalone
# (own manifest, always Postgres) via its own image; keeping it out of the
# default workspace keeps `cargo build --workspace` (and the oss-builds-alone
# guard) green on the sqlite default.
exclude = ["ee", "crates/dagron-gitops"]
resolver = "2"

[package]
name = "dagron"
version = "0.1.0"
edition = "2021"
# MSRV. Measured, not guessed: `cargo +<v> check --locked` across all three CI
# legs passes at 1.88 and fails at 1.86, where serde_with 3.21 stops building.
# The CI msrv job pins this exact toolchain so the number cannot rot. Bump only
# in a minor release, with a changelog line (docs/RELEASE.md §2).
rust-version = "1.88"
description = "dagron — durable DAG workflow runner on ractor: reconcile loop, pluggable executors (local + Docker), SQLite/Postgres backends."

[[bin]]
name = "dagron"
path = "src/main.rs"

[features]
# The engine is a thin shell over the dagron-engine library; feature names
# are unchanged but forward to it. default = full scheduler with the ops surface;
# drop `ops` (and pick a backend) for a lean reconcile-only daemon, e.g.
#   cargo build --no-default-features --features sqlite
default = ["sqlite", "ops"]
sqlite = ["dagron-engine/sqlite"]
postgres = ["dagron-engine/postgres"]
ops = ["dagron-engine/ops"]
kubernetes = ["dagron-engine/kubernetes"]
# MQTT ingestion source (SOURCE=mqtt).
mqtt = ["dagron-engine/mqtt"]
# OpenTelemetry integration (#28): W3C traceparent propagation into task env.
otel = ["dagron-engine/otel"]
# Object stores for archive-before-purge (`GC_ARCHIVE_URL=<scheme>://…`), one
# feature per backend, under the names the engine library gives them. The
# published engine images are built with all three (.github/workflows/docker.yml).
archive-s3 = ["dagron-engine/archive-s3"]
archive-gcs = ["dagron-engine/archive-gcs"]
archive-azure = ["dagron-engine/archive-azure"]
# `dagron archive-compact`: archived run documents folded into Parquet. Heavy
# (arrow and parquet), and in no published image.
archive-parquet = ["dagron-engine/archive-parquet"]
# Optional feature: auto-backfill, run_reruns, parameterized rerun, extra
# metrics, and outbox eventing. Implies `ops`.
enterprise = ["dagron-engine/enterprise"]

[dependencies]
# All engine logic lives in dagron-engine; this binary just calls run() with the
# default seams. default-features = false so a `--features postgres` build does
# not also drag in the engine's default `sqlite` backend (they collide).
dagron-engine = { path = "crates/dagron-engine", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"

[dev-dependencies]
# The crash-recovery integration test runs the built `dagron` binary and inspects
# its SQLite datastore directly (sqlx) with unique temp paths (uuid); on a
# Postgres build pg_run_wakes.rs makes a database of its own and reads it.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "macros"] }
uuid = { version = "1", features = ["v4"] }
# `net` and `io-util`: run_lifecycle.rs stands up a stub forge and calls the
# engine's ops API over plain TCP, so no HTTP client crate is needed.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
