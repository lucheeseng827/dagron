# Local full-stack bring-up for the dagron UI, validated with podman:
#   podman compose up --build
#
# Stack: Postgres ← engine (scheduler, runs migrations, ops API + resident) ←
# dagron-api (authed edge) ← Next.js frontend (proxies /api → dagron-api).
#
# Auth: dagron-api owns login. Sign in from the UI with the seeded admin
# (DAGRON_ADMIN_EMAIL / DAGRON_ADMIN_PASSWORD below); dagron-api mints an HS256
# session JWT signed with DAGRON_JWT_SECRET. scripts/mint-dev-token.mjs can still
# mint a token by hand for API-only testing.
name: dagron-ui

# Dev-only secret (≥32 chars, as dagron-api now requires). Change for any real deploy.
x-jwt-secret: &jwt_secret dev-insecure-jwt-secret-change-me-please

# Dev-only key for UI-managed environment secrets (AES-256-GCM). Shared by
# dagron-api (encrypts on write) and the engine (decrypts at dispatch) — both
# services below reference this anchor. Change for any real deploy.
x-env-secret-key: &env_secret_key dev-insecure-env-secret-key-change-me

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: dagron
      POSTGRES_PASSWORD: dagron
      POSTGRES_DB: workflow
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagron -d workflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  engine:
    build:
      context: .
      dockerfile: Dockerfile
      target: localdev   # debian-slim runtime so example `echo` tasks resolve (distroless has none)
      args:
        FEATURES: postgres,ops
    environment:
      DATABASE_URL: postgres://dagron:dagron@postgres:5432/workflow
      API_ADDR: 0.0.0.0:8787   # keeps the process resident + serves the internal ops API
      EXECUTOR: local
      # Turns on the artifact store, which the checkpoint/resume and batch
      # examples require: the engine injects DAGRON_ARTIFACTS per run and
      # DAGRON_CHECKPOINT_DIR per task. Without it those examples fail at once
      # with ":? set DAGRON_ARTIFACT_DIR on the engine" — correct, but a poor
      # first meeting with the feature the AI examples exist to show.
      DAGRON_ARTIFACT_DIR: /artifacts
      DAGRON_ENV_SECRET_KEY: *env_secret_key
      RUST_LOG: info
    volumes:
      # Shared with dagron-api, which serves these back over /api/artifacts —
      # the engine writing to its own container filesystem would leave the API
      # reading an empty directory.
      - dagron-artifacts:/artifacts
    # The ops API binds only after init_pool() has run every migration, so a
    # successful connect proves the schema is committed — which is what
    # dagron-api waits on below to avoid racing the migrator on a clean volume.
    # bash's /dev/tcp keeps this dependency-free: the localdev image is
    # debian-slim, with no curl, wget or nc to call.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8787"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    depends_on:
      postgres:
        condition: service_healthy

  dagron-api:
    build:
      context: .
      dockerfile: crates/dagron-api/Dockerfile
    environment:
      DATABASE_URL: postgres://dagron:dagron@postgres:5432/workflow
      DAGRON_JWT_SECRET: *jwt_secret
      DAGRON_ENV_SECRET_KEY: *env_secret_key
      # Local stack is plain HTTP, so don't mark the session cookie Secure
      # (a Secure cookie wouldn't be stored over http://). Leave default (true) in prod.
      DAGRON_COOKIE_SECURE: "false"
      # First-login admin, seeded idempotently on startup (self-contained auth).
      DAGRON_ADMIN_EMAIL: admin@local
      DAGRON_ADMIN_PASSWORD: dagron-admin
      DAGRON_ADMIN_NAME: Administrator
      PORT: "8080"
      RUST_LOG: info
      # Argon2id needs ~19 MiB of scratch per hash. glibc *grows* its mmap
      # threshold as it sees repeated frees that size, after which those chunks
      # come off the heap and are never returned — RSS climbed to ~227 MB over a
      # few dozen logins and stayed there. Pinning the threshold keeps every
      # argon2 scratch buffer an mmap, released on free. Measured, 30 logins:
      #   unset                     67 MB -> 227 MB
      #   MALLOC_ARENA_MAX only    5.6 MB -> 166 MB
      #   + threshold pinned       5.6 MB ->  5.9 MB   (flat)
      # The arena cap stays for the idle baseline; the concurrency bound is
      # DAGRON_PW_HASH_CONCURRENCY (default 2 → ~38 MiB live at once).
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_ARENA_MAX: "2"
      # The console reaches dagron-api through the frontend's /api rewrite, so
      # every login arrives from the frontend container's address. Key the login
      # rate limit off the forwarded client address instead — safe here because
      # this port is bound to 127.0.0.1 and the proxy sets the header. Leave unset
      # anywhere dagron-api is reachable directly (a caller can forge it).
      DAGRON_TRUST_PROXY_HEADERS: "true"
      # Same store the engine writes to, so /api/artifacts can serve what a run
      # produced.
      DAGRON_ARTIFACT_DIR: /artifacts
    volumes:
      - dagron-artifacts:/artifacts
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # `service_started` is not enough on its own: the engine runs its sqlx
      # migrations *after* the process starts, and four of the tables it creates
      # (users/008, git_repos/009, environments + environment_secrets/026) are
      # ones dagron-api also ensures at boot. Two concurrent `CREATE TABLE IF NOT
      # EXISTS` for the same table do not serialize — the loser dies on
      # "duplicate key value violates unique constraint pg_type_typname_nsp_index".
      # Waiting for the engine's management API means its migrations are durable.
      engine:
        condition: service_healthy

  # GitOps worker — the only image that carries a `git` binary, and the only one
  # you need if you connect repositories. Opt in with:
  #   podman compose --profile gitops up -d
  # Left out of the default stack on purpose: most deployments never use GitOps,
  # and the console now says "no GitOps worker running" rather than pretending
  # auto-sync is on when nothing is polling.
  gitops:
    profiles: ["gitops"]
    build:
      context: .
      dockerfile: crates/dagron-gitops/Dockerfile
    environment:
      DATABASE_URL: postgres://dagron:dagron@postgres:5432/workflow
      # Seconds between auto-sync reconciles per repo (manual Sync is immediate).
      GITOPS_POLL_SECS: "60"
      # Decrypts the per-repository credentials (HTTPS token / SSH key) set on
      # the GitOps page. MUST match dagron-api's — dagron-api encrypts them on
      # write and this worker is the only thing that reads them back. Without
      # it, a repo with a stored credential fails its sync saying so.
      DAGRON_ENV_SECRET_KEY: *env_secret_key
      # Fallback token for repos with no credential of their own. Sent only to
      # trusted forge hosts over https; leave unset for public repos.
      # DAGRON_GIT_TOKEN: ""
      # Refuse an SSH sync unless the repo has known_hosts pinned, instead of
      # falling back to trusting whatever host answers. Off by default so
      # existing repos keep syncing.
      # DAGRON_GIT_SSH_STRICT: "1"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      # dagron-api owns the schema this worker waits for.
      dagron-api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the Next /api rewrite at build time; the standalone server
        # can't change it at runtime, so it is intentionally only a build arg.
        DAGRON_API_URL: http://dagron-api:8080
        # Same deal for the version in the sidebar brand. Release images get the
        # image tag here (see .github/workflows/docker.yml); a local stack has no
        # tag, so it shows "dev" rather than inventing a number.
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      dagron-api:
        condition: service_started

volumes:
  dagron-artifacts:
