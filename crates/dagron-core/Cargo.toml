[package]
name = "dagron-core"
version = "0.1.0"
edition = "2021"
description = "dagron core: DAG model + validation, matrix/call expansion, the datastore facade (SQLite/Postgres) and the process metrics registry. The foundation the engine, API and operator share."

[lib]
name = "dagron_core"
path = "src/lib.rs"

[features]
# Exactly one datastore backend must be active (enforced by compile_error! in
# db.rs). `default = sqlite` so `cargo build --workspace` and standalone checks
# resolve a backend; dependents that pick a different backend depend on this
# crate with `default-features = false` and forward the one they want.
default = ["sqlite"]
# Zero-infra single-node backend (optimistic CAS claim).
sqlite = ["sqlx/sqlite"]
# Horizontal scale: FOR UPDATE SKIP LOCKED + LISTEN/NOTIFY.
#
# TLS ships WITH the backend, not as a separate opt-in, because a Postgres you
# would actually run this against requires it. sqlx is declared
# `default-features = false` below, so without this the driver has no TLS at all
# and any `sslmode=require` DSN dies at connect with:
#
#   TLS upgrade required by connect options but SQLx was built without TLS
#   support enabled
#
# That rules out every managed Postgres -- RDS (which sets rds.force_ssl by
# default), Cloud SQL, Azure -- and any hardened self-hosted instance. The
# documented engine build (`--features postgres,ops,kubernetes`) could not
# connect to RDS at all until this was added.
#
# `tls-rustls-ring` is the TLS stack the rest of this workspace's Postgres
# clients already use, so one is resolved rather than two. It builds `ring` (C/asm), which the
# engine Dockerfile already has a toolchain for (build-essential, cmake,
# pkg-config), and the distroless/cc runtime image carries the CA bundle.
# sqlite-only builds are untouched.
postgres = ["sqlx/postgres", "sqlx/tls-rustls-ring"]
# Management/UI surface: the extra datastore queries (run listings, dead-letter
# inspection, DB-backed schedules, status counts) + metrics fields that back the
# `ops` HTTP API in the binary. Pure gating, no deps — a lean reconcile-only build
# leaves it off. Mirrors (and is enabled by) the binary's `ops` feature.
ops = []
# Optional feature: auto-backfill sweep, run_reruns ledger, parameterized
# rerun metrics, and outbox eventing. Implies `ops` (the management surface).
enterprise = ["ops"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
petgraph = "0.6"
chrono = "0.4"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
# statvfs for the SQLite free-disk admission floor (DAGRON_MIN_FREE_BYTES).
libc = "0.2"
