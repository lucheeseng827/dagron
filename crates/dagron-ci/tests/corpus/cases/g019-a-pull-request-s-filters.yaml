shows: A workflow's pull_request filters are read as its branches and paths
front: github
event: { kind: pull_request, changed: [src/lib.rs] }
github: { runs_on: { ubuntu-latest: "docker.io/library/ubuntu:24.04" } }
source: |
  on:
    pull_request:
      branches: [main]
      paths:
        - "src/**"
        - "!src/**/*.md"
  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - run: make test
