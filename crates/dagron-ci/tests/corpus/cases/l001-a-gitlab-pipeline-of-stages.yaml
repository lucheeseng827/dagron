shows: A GitLab pipeline's jobs wait for every job of the stages before their own
front: gitlab
file: gitlab-ci
source: |
  image: alpine:3.20
  stages: [build, test, deploy]
  build:
    stage: build
    script: [make]
  unit:
    stage: test
    script: [make test]
  lint:
    stage: test
    script: [make lint]
  deploy:
    stage: deploy
    script: [make deploy]
