shows: A job's needs are the jobs it waits for
front: github
github: { runs_on: { ubuntu-latest: "docker.io/library/ubuntu:24.04" } }
source: |
  on: push
  jobs:
    lint:
      runs-on: ubuntu-latest
      steps:
        - run: make lint
    test:
      runs-on: ubuntu-latest
      needs: lint
      steps:
        - run: make test
    package:
      runs-on: ubuntu-latest
      needs: [lint, test]
      steps:
        - run: make package
