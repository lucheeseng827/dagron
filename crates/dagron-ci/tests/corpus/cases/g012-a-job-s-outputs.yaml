shows: A job's outputs reach the job that needs it, as values read when that job is claimed
front: github
github: { runs_on: { ubuntu-latest: "docker.io/library/ubuntu:24.04" } }
source: |
  on: push
  jobs:
    version:
      runs-on: ubuntu-latest
      outputs:
        tag: ${{ steps.read.outputs.tag }}
      steps:
        - id: read
          run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
    publish:
      runs-on: ubuntu-latest
      needs: version
      steps:
        - run: echo "publishing ${{ needs.version.outputs.tag }}"
