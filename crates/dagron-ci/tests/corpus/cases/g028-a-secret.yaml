shows: A secret a step reads is a reference into the repository's environment (github.com/acme/widgets), which the engine reads as the job is dispatched, and which is empty where the environment holds none
front: github
github: { runs_on: { ubuntu-latest: "docker.io/library/ubuntu:24.04" } }
source: |
  on: push
  jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - run: ./deploy.sh
          env:
            TOKEN: ${{ secrets.DEPLOY_TOKEN }}
