# Conditions on jobs and on steps, of the kinds that can be read and one that cannot.
name: conditions
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: make
      - if: github.event_name == 'pull_request'
        run: make preview
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: make snapshot
      - if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: make dist
      - if: contains(github.event.head_commit.message, '[full]')
        run: make full
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: make deploy
  preview:
    needs: build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - run: make preview
  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: make manual
  on-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: make main
  cleanup:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: make clean
  alert:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: make alert
