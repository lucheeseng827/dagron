# A release cut when a tag is pushed.
name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make dist
      - name: Notes
        run: git log --oneline "$(git describe --tags --abbrev=0 HEAD^)..HEAD" > notes.txt
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - run: echo "released ${{ github.ref_name }} at ${{ github.sha }}"
