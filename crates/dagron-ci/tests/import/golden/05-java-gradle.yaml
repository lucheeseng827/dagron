name: java-ci-with-gradle
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
tasks:
- name: build
  docker_image: docker.io/library/eclipse-temurin:21-jdk
  steps:
  - name: Setup Gradle
    run: |
      cat >&2 <<'DAGRON_IMPORT'
      dagron-import left this to do by hand:
        jobs.build.steps[2]: the action gradle/actions/setup-gradle@v4 is not imported: write the commands it stood for in its place
      DAGRON_IMPORT
      exit 1
  - name: Build with Gradle Wrapper
    run: ./gradlew build
