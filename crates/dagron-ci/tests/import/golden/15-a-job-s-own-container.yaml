# Imported from a GitHub Actions workflow by dagron-import.
#
# To do by hand (5):
#   jobs.build.container.options, jobs.build.container.credentials: a job's container is its image here, and takes nothing else
#   jobs.build.steps[0].submodules: the checkout here is the event's commit of this repository, and takes no such setting
#   jobs.build.services.cache.credentials: a service has no such key here
#   jobs.other.runs-on: no image is known for macos-14: name the job's docker_image, or give the importer one (--image LABEL=IMAGE)
#
# Changed on the way (2):
#   jobs: a step that named no shell ran under bash on a runner GitHub hosts, and a step here is run by `sh -e`: a script that is bash's calls bash
#   jobs: a job that set no timeout had GitHub's six hours, and has dagron-ci's own here (an hour, unless CI_DEFAULT_TIMEOUT_SECS says another): say timeout_secs where a job needs longer
name: container
on:
  push: {}
tasks:
- name: build
  docker_image: ghcr.io/acme/build:1.4
  services:
  - name: cache
    image: ghcr.io/acme/cache:2
  steps:
  - name: 'imported: to do'
    run: |
      cat >&2 <<'DAGRON_IMPORT'
      dagron-import left this to do by hand:
        jobs.build.container.options: a job's container is its image here, and takes nothing else
        jobs.build.container.credentials: a job's container is its image here, and takes nothing else
        jobs.build.steps[0].submodules: the checkout here is the event's commit of this repository, and takes no such setting
        jobs.build.services.cache.credentials: a service has no such key here
      DAGRON_IMPORT
      exit 1
  - run: make
- name: plain
  docker_image: docker.io/library/debian:12
  steps:
  - run: uname -a
- name: other
  steps:
  - name: 'imported: to do'
    run: |
      cat >&2 <<'DAGRON_IMPORT'
      dagron-import left this to do by hand:
        jobs.other.runs-on: no image is known for macos-14: name the job's docker_image, or give the importer one (--image LABEL=IMAGE)
      DAGRON_IMPORT
      exit 1
  - run: xcodebuild -version
