# Imported from a GitHub Actions workflow by dagron-import.
#
# Changed on the way (6):
#   jobs.test.steps[1]: actions/setup-node is the job's image, docker.io/library/node:20-bookworm-slim: the toolchain is in the image, and no step installs it
#   jobs.test.steps[1].with.cache: npm is the job's cache "npm", keyed by **/package-lock.json
#   jobs.test.steps[2], jobs.test.steps[3]: the step ran under bash, and a step here is `sh -e`: call bash in the script where it needs one
#   jobs.test.services.postgres.options: its health command is the service's `ready`; its other options are left
#   jobs: a job that set no timeout had GitHub's six hours, and has dagron-ci's own here (an hour, unless CI_DEFAULT_TIMEOUT_SECS says another): say timeout_secs where a job needs longer
#
# Not carried over (1):
#   jobs.test.services.postgres.ports: the job reaches the service at its name, `postgres`, on the port its image listens on
name: api
on:
  push:
    branches:
    - main
    paths:
    - api/**
tasks:
- name: test
  docker_image: docker.io/library/node:20-bookworm-slim
  env:
  - name: DATABASE_URL
    value: postgres://postgres:pw@localhost:5432/postgres
  workspace:
    cache:
    - prefix: npm
      key_files:
      - '**/package-lock.json'
      paths:
      - ~/.npm
  services:
  - name: postgres
    image: postgres:16-alpine
    env:
    - name: POSTGRES_PASSWORD
      value: pw
    ready: pg_isready -U postgres
  - name: redis
    image: redis:7-alpine
  steps:
  - run: |-
      cd 'api'
      npm ci
  - env:
      NODE_ENV: test
    run: |-
      cd 'api/server'
      npm test
