# Imported from a GitHub Actions workflow by dagron-import.
#
# To do by hand (2):
#   jobs.release.steps[1]: the action softprops/action-gh-release@v2 (with files) is not imported: write the commands it stood for in its place
#   jobs.release.steps[2]: `github.ref_name` in the script has nothing to stand for it here: the step stops where it is read
#
# Changed on the way (6):
#   name: "Release" is "release": a pipeline's name is letters, digits, '.', '_' and '-', and its checks are called by it
#   jobs.build.runs-on, jobs.release.runs-on: ubuntu-latest is the image docker.io/library/ubuntu:24.04: an operating system, with none of the tools a hosted runner holds
#   jobs.release.steps[2]: what the script read in `${{ }}` is a variable of the shell's here, which the shell fills in as it runs the script
#   jobs: a step that named no shell ran under bash on a runner GitHub hosts, and a step here is run by `sh -e`: a script that is bash's calls bash
#   jobs: a job that set no timeout had GitHub's six hours, and has dagron-ci's own here (an hour, unless CI_DEFAULT_TIMEOUT_SECS says another): say timeout_secs where a job needs longer
name: release
on:
  push:
    tags:
    - v*
tasks:
- name: build
  docker_image: docker.io/library/ubuntu:24.04
  workspace:
    checkout:
      depth: 0
  steps:
  - run: make dist
  - name: Notes
    run: git log --oneline "$(git describe --tags --abbrev=0 HEAD^)..HEAD" > notes.txt
- name: release
  docker_image: docker.io/library/ubuntu:24.04
  depends_on:
  - build
  when: '{{ ci_event }} == tag'
  steps:
  - name: 'imported: to do'
    run: |
      cat >&2 <<'DAGRON_IMPORT'
      dagron-import left this to do by hand:
        jobs.release.steps[2]: `github.ref_name` in the script has nothing to stand for it here: the step stops where it is read
      DAGRON_IMPORT
      exit 1
  - name: softprops/action-gh-release@v2
    run: |
      cat >&2 <<'DAGRON_IMPORT'
      dagron-import left this to do by hand:
        jobs.release.steps[1]: the action softprops/action-gh-release@v2 (with files) is not imported: write the commands it stood for in its place
      DAGRON_IMPORT
      exit 1
  - run: echo "released ${IMPORT_TODO:?not imported, github.ref_name} at ${CI_SHA}"
