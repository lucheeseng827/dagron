# Imported from a GitHub Actions workflow by dagron-import.
#
# Changed on the way (3):
#   jobs.test.runs-on: ubuntu-24.04 is the image docker.io/library/ubuntu:24.04: an operating system, with none of the tools a hosted runner holds
#   jobs: a step that named no shell ran under bash on a runner GitHub hosts, and a step here is run by `sh -e`: a script that is bash's calls bash
#   jobs: a job that set no timeout had GitHub's six hours, and has dagron-ci's own here (an hour, unless CI_DEFAULT_TIMEOUT_SECS says another): say timeout_secs where a job needs longer
#
# Not carried over (1):
#   on.pull_request.types: a pull request runs when it is opened, updated or reopened, and for no other activity
name: filters
on:
  push:
    branches_ignore:
    - wip/**
    tags_ignore:
    - '*-rc.*'
    paths_ignore:
    - docs/**
    - '**.md'
  pull_request:
    branches:
    - main
    - release/**
    paths:
    - src/**
    - '!src/**/*.md'
  merge_group: {}
tasks:
- name: test
  docker_image: docker.io/library/ubuntu:24.04
  steps:
  - run: make test
