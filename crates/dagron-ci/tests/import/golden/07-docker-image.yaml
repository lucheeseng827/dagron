#   jobs.build.steps[1]: the action docker/login-action@v3 (with registry, username, password) is not imported: write the commands it stood for in its place
#   jobs.build.steps[2]: the action docker/build-push-action@v6 (with context, push, tags) is not imported: write the commands it stood for in its place
#
# Changed on the way (3):
#   name: "Docker" is "docker": a pipeline's name is letters, digits, '.', '_' and '-', and its checks are called by it
#   jobs.build.runs-on: ubuntu-latest is the image docker.io/library/ubuntu:24.04: an operating system, with none of the tools a hosted runner holds
#   jobs: a job that set no timeout had GitHub's six hours, and has dagron-ci's own here (an hour, unless CI_DEFAULT_TIMEOUT_SECS says another): say timeout_secs where a job needs longer
#
# Not carried over (1):
#   jobs.build.permissions: a job is given no token for its forge, so there is nothing to narrow
name: docker
on:
  push:
    branches:
    - main
    tags:
    - v*.*.*
tasks:
- name: build
  docker_image: docker.io/library/ubuntu:24.04
  steps:
  - name: Log into registry
    run: |
      cat >&2 <<'DAGRON_IMPORT'
      dagron-import left this to do by hand:
        jobs.build.steps[1]: the action docker/login-action@v3 (with registry, username, password) is not imported: write the commands it stood for in its place
      DAGRON_IMPORT
      exit 1
  - name: Build and push Docker image
    run: |
      cat >&2 <<'DAGRON_IMPORT'
      dagron-import left this to do by hand:
        jobs.build.steps[2]: the action docker/build-push-action@v6 (with context, push, tags) is not imported: write the commands it stood for in its place
      DAGRON_IMPORT
