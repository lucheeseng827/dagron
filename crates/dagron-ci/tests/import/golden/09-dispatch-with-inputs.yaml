# Imported from a GitHub Actions workflow by dagron-import.
#
# To do by hand (1):
#   jobs.deploy.steps[2]: `github.actor` in the script has nothing to stand for it here: the step stops where it is read
#
# Changed on the way (6):
#   name: "Deploy" is "deploy": a pipeline's name is letters, digits, '.', '_' and '-', and its checks are called by it
#   on.workflow_dispatch.inputs.dry-run: the input is "dry_run" here: an input is named as a parameter is
#   jobs.deploy.steps[1]: what the script read in `${{ }}` is a variable of the shell's here, which the shell fills in as it runs the script
#   jobs.deploy.runs-on: ubuntu-latest is the image docker.io/library/ubuntu:24.04: an operating system, with none of the tools a hosted runner holds
#   jobs: a step that named no shell ran under bash on a runner GitHub hosts, and a step here is run by `sh -e`: a script that is bash's calls bash
#   jobs: a job that set no timeout had GitHub's six hours, and has dagron-ci's own here (an hour, unless CI_DEFAULT_TIMEOUT_SECS says another): say timeout_secs where a job needs longer
#
# Not carried over (2):
#   on.workflow_dispatch.inputs.environment: its type, choice: every input here is text, and what it may be is for the step that reads it to check
#   on.workflow_dispatch.inputs.dry-run: its type, boolean: every input here is text, and what it may be is for the step that reads it to check
name: deploy
on:
  dispatch:
    inputs:
      environment:
        description: Where to deploy
        default: dev
        required: true
      dry_run:
        description: Say what would be done, and do nothing
        default: 'true'
      version:
        required: true
tasks:
- name: deploy
  docker_image: docker.io/library/ubuntu:24.04
  env:
  - name: TARGET
    value: '{{ environment }}'
  steps:
  - name: 'imported: to do'
    run: |
      cat >&2 <<'DAGRON_IMPORT'
      dagron-import left this to do by hand:
        jobs.deploy.steps[2]: `github.actor` in the script has nothing to stand for it here: the step stops where it is read
      DAGRON_IMPORT
      exit 1
  - env:
      INPUT_DRY_RUN: '{{ dry_run }}'
      INPUT_VERSION: '{{ version }}'
    run: ./deploy.sh "${INPUT_VERSION}" --dry-run="${INPUT_DRY_RUN}"
  - run: echo "deployed $TARGET by ${IMPORT_TODO:?not imported, github.actor}"
