# Imported from a Jenkinsfile by dagron-import.
#
# To do by hand (2):
#   stage('Publish').steps[1]: string's credentialsId, "deploy-${params.TARGET}", is Groovy, which is not run here: the secret is not given. Name the secret it stood for
#   stage('Test'): the credentials it reads are an environment's secrets here (npm_token, prod_token, staging_token): name the environment that holds them (environment:), and accept that every step of the job can read $TOKEN__staging_token, $TOKEN__prod_token, $TOKEN__npm_token (each a stage's secret, which Jenkins gave to that stage's steps alone), or give the stage a job of its own
#
# Changed on the way (8):
#   on: a multibranch pipeline's builds are each branch and tag pushed, each pull request, and a run asked for (dispatch) here: say on: where it ran for fewer
#   stage('Deploy staging').environment.TOKEN: credentials('staging-token') is the secret staging_token of the job's environment: where it was a username and password, it is one value here, and where it was a file, the job is given what the file holds and not a path to it. The job holds it as $TOKEN__staging_token, which each of the stage's steps sets $TOKEN from at its head: every step of the job has it under that name, where Jenkins gave it to the stage's steps alone
#   stage('Deploy prod').environment.TOKEN: credentials('prod-token') is the secret prod_token of the job's environment: where it was a username and password, it is one value here, and where it was a file, the job is given what the file holds and not a path to it. The job holds it as $TOKEN__prod_token, which each of the stage's steps sets $TOKEN from at its head: every step of the job has it under that name, where Jenkins gave it to the stage's steps alone
#   stage('Deploy prod').when: its when is a test at the head of each of its steps, which end there where it is false: the job passes, where Jenkins skipped the stage
#   stage('Deploy prod').steps[0]: it reads $BRANCH_NAME: each is set at the head of its script
#   stage('Publish').steps[0]: the secret npm_token is held by the job as $TOKEN__npm_token, which each step of the block sets $TOKEN from at its head: every step of the job has it under that name, where Jenkins gave it to the block's steps alone
#   stage('Test').steps[0]: Jenkins's variables a step reads are set at its head from dagron-ci's own (CI_SHA, CI_REF, …): a program it runs that reads one the step does not is not given it
#   stage('Deploy prod').steps[0]: $BRANCH_NAME is a branch's or a tag's name, and PR-<number> for a pull request, as a multibranch pipeline has it
name: 15-credentials-of-a-stage
on:
  push: {}
  pull_request: {}
  dispatch: {}
tasks:
- name: test
  docker_image: node:22-bookworm-slim
  env:
  - name: TOKEN__staging_token
    value_from:
      secret: staging_token
  - name: TOKEN__prod_token
    value_from:
      secret: prod_token
  - name: TOKEN__npm_token
    value_from:
      secret: npm_token
  steps:
  - name: 'imported: to do'
    run: |
      cat >&2 <<'DAGRON_IMPORT'
      dagron-import left this to do by hand:
        stage('Publish').steps[1]: string's credentialsId, "deploy-${params.TARGET}", is Groovy, which is not run here: the secret is not given. Name the secret it stood for
        stage('Test'): the credentials it reads are an environment's secrets here (npm_token, prod_token, staging_token): name the environment that holds them (environment:), and accept that every step of the job can read $TOKEN__staging_token, $TOKEN__prod_token, $TOKEN__npm_token (each a stage's secret, which Jenkins gave to that stage's steps alone), or give the stage a job of its own
      DAGRON_IMPORT
      exit 1
  - name: Test
    run: npm test
  - name: Deploy staging
    run: |-
      export TOKEN="$TOKEN__staging_token"
      ./deploy.sh staging
  - name: Deploy prod
    run: |-
      case "$CI_EVENT" in pull_request) export BRANCH_NAME="PR-$CI_PR" ;; *) export BRANCH_NAME="${CI_REF#refs/*/}" ;; esac
      export TOKEN="$TOKEN__prod_token"
      # when { branch 'main' }
      { case "$BRANCH_NAME" in 'main') true ;; *) false ;; esac; } || exit 0
      ./deploy.sh prod
  - name: Publish
    run: |-
      export TOKEN="$TOKEN__npm_token"
      npm publish
  - name: Publish
    run: ./announce.sh
