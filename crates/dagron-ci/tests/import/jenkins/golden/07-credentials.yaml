# Imported from a Jenkinsfile by dagron-import.
#
# To do by hand (3):
#   stage('Publish').steps[1]: file(kubeconfig) is not given: a secret here is a variable's value, and not a file or a key on disk. Write it to a file in a step, from a secret
#   stage('Publish').steps[2]: the step reads $NPM_TOKEN_PSW, which Jenkins gave a username and password's credentials: a secret here is one value, so keep each in a secret of its own, and give it to the job in its env
#   stage('Publish'): the credentials it reads are an environment's secrets here (npm_token, registry_password, registry_username, slack_hook): name the environment that holds them (environment:), and accept that every step of the job can read $REG_USER__registry_username, $REG_PASS__registry_password, $HOOK__slack_hook (each a stage's secret, which Jenkins gave to that stage's steps alone), or give the stage a job of its own
#
# Changed on the way (8):
#   on: a multibranch pipeline's builds are each branch and tag pushed, each pull request, and a run asked for (dispatch) here: say on: where it ran for fewer
#   environment.NPM_TOKEN: credentials('npm-token') is the secret npm_token of the job's environment: where it was a username and password, it is one value here, and where it was a file, the job is given what the file holds and not a path to it
#   environment.IMAGE: its value names other variables: it is set at the head of each step, where the shell fills them in as Groovy did
#   stage('Publish').steps[0]: the username and password of registry are two secrets here, registry_username and registry_password
#   stage('Publish').steps[0]: the secret registry_username is held by the job as $REG_USER__registry_username, which each step of the block sets $REG_USER from at its head: every step of the job has it under that name, where Jenkins gave it to the block's steps alone
#   stage('Publish').steps[0]: the secret registry_password is held by the job as $REG_PASS__registry_password, which each step of the block sets $REG_PASS from at its head: every step of the job has it under that name, where Jenkins gave it to the block's steps alone
#   stage('Publish').steps[1]: the secret slack_hook is held by the job as $HOOK__slack_hook, which each step of the block sets $HOOK from at its head: every step of the job has it under that name, where Jenkins gave it to the block's steps alone
#   stage('Publish').steps[0][0]: Jenkins's variables a step reads are set at its head from dagron-ci's own (CI_SHA, CI_REF, …): a program it runs that reads one the step does not is not given it
name: 07-credentials
on:
  push: {}
  pull_request: {}
  dispatch: {}
tasks:
- name: publish
  docker_image: alpine:3.20
  env:
  - name: REGISTRY
    value: registry.example.com
  - name: NPM_TOKEN
    value_from:
      secret: npm_token
  - name: REG_USER__registry_username
    value_from:
      secret: registry_username
  - name: REG_PASS__registry_password
    value_from:
      secret: registry_password
  - name: HOOK__slack_hook
    value_from:
      secret: slack_hook
  steps:
  - name: 'imported: to do'
    run: |
      cat >&2 <<'DAGRON_IMPORT'
      dagron-import left this to do by hand:
        stage('Publish').steps[1]: file(kubeconfig) is not given: a secret here is a variable's value, and not a file or a key on disk. Write it to a file in a step, from a secret
        stage('Publish').steps[2]: the step reads $NPM_TOKEN_PSW, which Jenkins gave a username and password's credentials: a secret here is one value, so keep each in a secret of its own, and give it to the job in its env
        stage('Publish'): the credentials it reads are an environment's secrets here (npm_token, registry_password, registry_username, slack_hook): name the environment that holds them (environment:), and accept that every step of the job can read $REG_USER__registry_username, $REG_PASS__registry_password, $HOOK__slack_hook (each a stage's secret, which Jenkins gave to that stage's steps alone), or give the stage a job of its own
      DAGRON_IMPORT
      exit 1
  - name: Publish
    run: |-
      export IMAGE="${REGISTRY}/team/app"
      export REG_USER="$REG_USER__registry_username"
      export REG_PASS="$REG_PASS__registry_password"
      echo "$REG_PASS" | docker login -u "$REG_USER" --password-stdin "$REGISTRY"
  - name: Publish
    run: |-
      export IMAGE="${REGISTRY}/team/app"
      export HOOK="$HOOK__slack_hook"
      curl -fsS -X POST "$HOOK" -d "published $IMAGE"
  - name: Publish
    run: |-
      export IMAGE="${REGISTRY}/team/app"
      npm publish --userconfig=.npmrc # uses $NPM_TOKEN_PSW
