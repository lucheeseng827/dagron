# Imported from a GitLab CI pipeline by dagron-import.
#
# To do by hand (1):
#   review: $CI_COMMIT_MESSAGE cannot be read before a run: the job is written to run wherever it might have, which is more than it did
#
# Changed on the way (5):
#   image: the pipeline's image is each job's that does not set its own
#   build.script: a job's script ran under bash where its image had bash, and a step here is run by `sh -e`: a script that is bash's calls bash
#   release: $RELEASE is read as the file sets it, for a branch's, a tag's and a merge request's pipeline: where the project's CI/CD variables set it otherwise, the job is in pipelines here it was not in, or not in those it was. Write its when: for what it should run for
#   on.pull_request: a merge request's pipeline is a pull request's here; GitLab's merged-results and merge-train pipelines are not told apart from it
#   on.dispatch: a pipeline run from GitLab's page or its API is a run asked for here (dispatch), through the run API
#
# Not carried over (1):
#   build: no pipeline here is a schedules pipeline: a condition that names one never holds here (a schedule asks for a run through the run API, as a dispatch)
name: 08-only-and-except
on:
  push: {}
  pull_request: {}
  dispatch: {}
tasks:
- name: build
  docker_image: maven:3.9-eclipse-temurin-21
  when: '{{ ci_event }} in [push, tag, dispatch]'
  steps:
  - name: script
    run: mvn -B verify
- name: snapshot
  docker_image: maven:3.9-eclipse-temurin-21
  depends_on:
  - build
  when: '{{ ci_event }} == push and {{ ci_group }} in [refs/heads/main, refs/heads/release-1, refs/heads/release-2] or {{ ci_event }} == tag and {{ ci_group }} in [refs/tags/main, refs/tags/release-1, refs/tags/release-2] or {{ ci_event }} == dispatch and {{ ci_group }} in [refs/heads/main, refs/heads/release-1, refs/heads/release-2]'
  steps:
  - name: script
    run: mvn -B deploy
- name: release
  docker_image: maven:3.9-eclipse-temurin-21
  depends_on:
  - build
  when: '{{ ci_event }} == tag'
  env:
  - name: RELEASE
    value: yes
  steps:
  - name: script
    run: mvn -B deploy -Prelease
- name: review
  docker_image: maven:3.9-eclipse-temurin-21
  when: '{{ ci_event }} == pull_request'
  steps:
  - name: 'imported: to do'
    run: |
      cat >&2 <<'DAGRON_IMPORT'
      dagron-import left this to do by hand:
        review: $CI_COMMIT_MESSAGE cannot be read before a run: the job is written to run wherever it might have, which is more than it did
      DAGRON_IMPORT
      exit 1
  - name: script
    run: mvn -B verify -Preview
