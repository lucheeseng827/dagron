# A pipeline for main and for merge requests into it; a job per kind of
# change.
workflow:
  name: "Pipeline for $CI_COMMIT_REF_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

image: golang:1.23

stages: [test, release]

test:
  stage: test
  script:
    - go test ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

docs:
  stage: test
  script:
    - go run ./cmd/docs
  rules:
    - changes:
        - docs/**/*
    - exists:
        - mkdocs.yml

release:
  stage: release
  script:
    - go build -o app ./cmd/app
  rules:
    - if: $CI_COMMIT_TAG =~ /^(v1|v2)$/
    - if: $CI_COMMIT_TAG
      when: never
