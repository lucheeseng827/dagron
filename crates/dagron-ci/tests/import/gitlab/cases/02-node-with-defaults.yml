# A Node project: one image and one cache for every job, by default:.
default:
  image: node:22-bookworm-slim
  before_script:
    - npm ci --prefer-offline
  cache:
    key:
      files: [package-lock.json]
      prefix: npm
    paths:
      - .npm/
  interruptible: true

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

lint:
  stage: build
  script:
    - npm run lint

unit:
  script:
    - npm test -- --reporter=junit --reporter-option output=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml

e2e:
  timeout: 30 minutes
  retry: 2
  script:
    - npx playwright test
