# GitLab's own example of when: a cleanup that runs where the build
# failed, a deploy on a person's word, and a cleanup that runs always. The
# test runs where the build succeeded, and does not wait for the cleanup
# that runs where it failed.
image: alpine:3.20

stages: [build, cleanup_build, test, deploy, cleanup]

build_job:
  stage: build
  script: [make build]

cleanup_build_job:
  stage: cleanup_build
  script: [make cleanup-build]
  when: on_failure

test_job:
  stage: test
  script: [make test]

deploy_job:
  stage: deploy
  script: [make deploy]
  when: manual
  environment: production

cleanup_job:
  stage: cleanup
  script: [make cleanup]
  when: always
