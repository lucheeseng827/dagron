name: widgets-ci
parameters:
  ci_event: ''
  ci_ref: ''
  ci_sha: ''
  ci_base_sha: ''
  ci_base_ref: ''
  ci_pr: ''
  ci_repo: ''
  ci_forge_host: ''
  ci_group: ''
  ci_trust: ''
  profile: release
concurrency_key: '{{ ci_forge_host }}/{{ ci_repo }}:{{ ci_group }}'
max_active_runs: 1
when_full: queue
tags:
- ci
task_defaults:
  docker_image: rust:1.86-bookworm
  timeout_secs: 3600
  env:
  - name: CI_EVENT
    value: '{{ ci_event }}'
  - name: CI_REF
    value: '{{ ci_ref }}'
  - name: CI_SHA
    value: '{{ ci_sha }}'
  - name: CI_BASE_SHA
    value: '{{ ci_base_sha }}'
  - name: CI_BASE_REF
    value: '{{ ci_base_ref }}'
  - name: CI_PR
    value: '{{ ci_pr }}'
  - name: CI_REPO
    value: '{{ ci_repo }}'
  - name: CI_FORGE_HOST
    value: '{{ ci_forge_host }}'
  - name: CI_GROUP
    value: '{{ ci_group }}'
  - name: CI_TRUST
    value: '{{ ci_trust }}'
  - name: CARGO_TERM_COLOR
    value: always
tasks:
- name: lint
  command:
  - sh
  - -c
  - |
    # dagron-ci: this task's steps, in order, each in its own `sh -e`. They run
    # under dagron-ci-exec (step protocol 1) where the image has it, at
    # /dagron/bin or on PATH, and under the lines below where it does not.
    # Either way the markers go to stderr: the output is the steps'.
    for ci_exec in /dagron/bin/dagron-ci-exec "$(command -v dagron-ci-exec 2>/dev/null)"; do
      if [ -x "$ci_exec" ] && "$ci_exec" --speaks 1 >/dev/null 2>&1; then
        exec "$ci_exec"
      fi
    done
    ci_run() {
      if [ "$1" -gt 0 ]; then
        if command -v timeout >/dev/null 2>&1; then
          timeout -k 10 "$1" sh -ec "$2"
          return $?
        fi
        printf '%s\n' "::dagron-ci::warning::no timeout(1) in this image; the step runs without its $1 s limit" >&2
      fi
      sh -ec "$2"
    }
    ci_start() {
      printf '%s\n' "::dagron-ci::step::$1::start::$2" >&2
    }
    # A failed step ends the task, unless it may fail (its third argument, 1).
    ci_end() {
      printf '%s\n' "::dagron-ci::step::$1::end::$2" >&2
      [ "$2" -eq 0 ] && return 0
      [ "$3" = 1 ] || exit "$2"
      printf '%s\n' "::dagron-ci::step::$1::continued" >&2
    }
    ci_start 1 "$CI_STEP_1_NAME"; ( ci_run 0 "$CI_STEP_1_RUN" ); ci_end 1 $? 0
    exit 0
  workspace:
    checkout:
      commit: '{{ ci_sha }}'
      repository: https://{{ ci_forge_host }}/{{ ci_repo }}.git
  env:
  - name: CI_STEP_PROTOCOL
    value: '1'
  - name: CI_STEP_COUNT
    value: '1'
  - name: CI_STEP_1_NAME
    value: cargo fmt --all -- --check
  - name: CI_STEP_1_RUN
    value: cargo fmt --all -- --check
- name: test
  depends_on:
  - lint
  timeout_secs: 1800
  command:
  - sh
  - -c
  - |
    # dagron-ci: this task's steps, in order, each in its own `sh -e`. They run
    # under dagron-ci-exec (step protocol 1) where the image has it, at
    # /dagron/bin or on PATH, and under the lines below where it does not.
    # Either way the markers go to stderr: the output is the steps'.
    for ci_exec in /dagron/bin/dagron-ci-exec "$(command -v dagron-ci-exec 2>/dev/null)"; do
      if [ -x "$ci_exec" ] && "$ci_exec" --speaks 1 >/dev/null 2>&1; then
        exec "$ci_exec"
      fi
    done
    ci_run() {
      if [ "$1" -gt 0 ]; then
        if command -v timeout >/dev/null 2>&1; then
          timeout -k 10 "$1" sh -ec "$2"
          return $?
        fi
        printf '%s\n' "::dagron-ci::warning::no timeout(1) in this image; the step runs without its $1 s limit" >&2
      fi
      sh -ec "$2"
    }
    ci_start() {
      printf '%s\n' "::dagron-ci::step::$1::start::$2" >&2
    }
    # A failed step ends the task, unless it may fail (its third argument, 1).
    ci_end() {
      printf '%s\n' "::dagron-ci::step::$1::end::$2" >&2
      [ "$2" -eq 0 ] && return 0
      [ "$3" = 1 ] || exit "$2"
      printf '%s\n' "::dagron-ci::step::$1::continued" >&2
    }
    ci_start 1 "$CI_STEP_1_NAME"; ( export REF="$CI_STEP_1_ENV_REF"; export RUST_BACKTRACE="$CI_STEP_1_ENV_RUST_BACKTRACE"; ci_run 900 "$CI_STEP_1_RUN" ); ci_end 1 $? 0
    ci_start 2 "$CI_STEP_2_NAME"; ( ci_run 0 "$CI_STEP_2_RUN" ); ci_end 2 $? 1
    exit 0
  workspace:
    checkout:
      commit: '{{ ci_sha }}'
      repository: https://{{ ci_forge_host }}/{{ ci_repo }}.git
  env:
  - name: RUST_LOG
    value: info
  - name: CI_STEP_PROTOCOL
    value: '1'
  - name: CI_STEP_COUNT
    value: '2'
  - name: CI_STEP_1_NAME
    value: unit
  - name: CI_STEP_1_RUN
    value: cargo test --profile {{ profile }} -- --test-threads=1
  - name: CI_STEP_1_TIMEOUT_SECS
    value: '900'
  - name: CI_STEP_1_ENV_REF
    value: '{{ ci_ref }}'
  - name: CI_STEP_1_ENV_RUST_BACKTRACE
    value: '1'
  - name: CI_STEP_2_NAME
    value: scripts/flaky.sh
  - name: CI_STEP_2_RUN
    value: scripts/flaky.sh
  - name: CI_STEP_2_CONTINUE_ON_ERROR
    value: 'true'
- name: gate
  depends_on:
  - test
  approvers:
  - group:release
  type: approval
