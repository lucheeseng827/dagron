[package]
name = "dagron-plan"
version = "0.1.0"
edition = "2021"
description = "dagron-plan — show what a workflow change does before you merge it: diff two DAG specs (resolved through the real parser + expander) into a PR-friendly markdown + Mermaid report with git-diff-style exit codes."

[[bin]]
name = "dagron-plan"
path = "src/main.rs"

[lib]
name = "dagron_plan"
path = "src/lib.rs"

[dependencies]
# The plan resolves both specs through the exact parse → expand → validate
# pipeline the engine uses — only the `dag`/`expand` model, nothing here touches
# a datastore, so which backend feature is active doesn't matter functionally.
# core still requires exactly one to compile at all; take its sqlite default so
# `cargo build`/`test -p dagron-plan` work standalone with no extra flags.
# dagron-api's postgres-only dagron-core dependency is built in its own separate
# CI step specifically so it never has to unify features with this crate's choice.
dagron-core = { path = "../dagron-core" }
anyhow = "1"
