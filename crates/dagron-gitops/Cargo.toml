[package]
name = "dagron-gitops"
version = "0.1.0"
edition = "2021"
publish = false
description = "dagron GitOps worker — polls connected repos, validates their workflow specs, and reconciles them into the workflows table. Ships as its own optional image so the API gateway stays distroless and never shells out."

[[bin]]
name = "dagron-gitops"
path = "src/main.rs"

[dependencies]
# Spec validation uses the engine's own parser, so a repo file that syncs is a
# file the engine can actually run. `postgres` — this worker shares dagron-api's
# datastore, which is Postgres-only.
dagron-core = { path = "../dagron-core", default-features = false, features = ["postgres"] }
dagron-logging = { path = "../dagron-logging" }
# Decrypts the per-repository Git credential dagron-api stored. Same crate, same
# `v1:`/`v2:` wire format and the same key material as environment secrets — so
# this worker needs DAGRON_ENV_SECRET_KEY (or the KEK provider vars) exactly as
# the engine does, and a mismatched key surfaces as a decrypt error on the repo
# row rather than a silent fall back to unauthenticated cloning.
dagron-crypto = { path = "../dagron-crypto" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "signal"] }
# tls-rustls-ring: sqlx is declared default-features=false, so without a TLS
# backend any `sslmode=require` DSN fails at connect with "TLS upgrade
# required by connect options but SQLx was built without TLS support
# enabled". That rules out RDS (rds.force_ssl is on by default), Cloud SQL,
# Azure, and any hardened self-hosted Postgres. Same TLS stack the rest of
# this workspace's Postgres clients already use, so only one is resolved.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "tls-rustls-ring"] }
anyhow = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
serde_yaml = "0.9"
tracing = "0.1"
