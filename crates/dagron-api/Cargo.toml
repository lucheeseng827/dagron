[package]
name = "dagron-api"
version = "0.1.0"
edition = "2021"
description = "dagron management API — read-mostly axum service over the dagron Postgres, with LISTEN/NOTIFY → SSE live updates."

[[bin]]
name = "dagron-api"
path = "src/main.rs"

[features]
# Optional feature: parameterized rerun (`params` deep-merge). No extra
# crate dependencies — purely a code-gate on the rerun endpoint.
enterprise = [
    "dagron-core/enterprise",
    "dagron-artifact/enterprise",
    "dagron-crypto/enterprise",
]
# Fetch archived run documents from cloud object storage (`GC_ARCHIVE_URL`) for
# the /api/archive endpoints — same env contract and feature names as the
# engine. One feature per backend; S3-compatible MinIO/Ceph rides `archive-s3`.
# Each cloud feature turns on that provider across this binary: archived-run
# fetch AND the artifact-store backend (DAGRON_ARTIFACT_URL) speak to the same
# cloud with one flag.
archive-s3 = ["archive-cloud", "object_store/aws", "dagron-artifact/s3"]
archive-gcs = ["archive-cloud", "object_store/gcp", "dagron-artifact/gcs"]
archive-azure = ["archive-cloud", "object_store/azure", "dagron-artifact/azure"]
# Internal: shared object-store dep enabled by the cloud backends above.
archive-cloud = ["dep:object_store"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
badgelib = "0.5.1"
# `fs` adds ServeDir, which serves the exported console (see main.rs, console_router).
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }
# tls-rustls-ring: sqlx is declared default-features=false, so without a TLS
# backend any `sslmode=require` DSN fails at connect with "TLS upgrade
# required by connect options but SQLx was built without TLS support
# enabled". That rules out RDS (rds.force_ssl is on by default), Cloud SQL,
# Azure, and any hardened self-hosted Postgres. Same TLS stack the rest of
# this workspace's Postgres clients already use, so only one is resolved.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "tls-rustls-ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
# GitOps "sync to Git" — open a PR via the GitHub REST API.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
base64 = "0.22"
# Personal access tokens: OS CSPRNG to mint, SHA-256 to store (a token is 32
# random bytes, so a password KDF would only add cost to every request without
# adding strength), and constant-time comparison to verify.
rand = "0.8"
sha2 = "0.10"
subtle = "2"
anyhow = "1"
tracing = "0.1"
# Shared, env-tunable logging bootstrap (single source of truth). `logfilter`
# adds the read-side filter grammar the log-view endpoints apply. It is the one
# parser for that grammar across the stack, so a filter can only ever mean one
# thing wherever it is written down.
dagron-logging = { path = "../dagron-logging", features = ["logfilter"] }
# The identity seam: ships LocalIdentityProvider behind this trait; an alternate provider can swap SSO in.
dagron-identity = { path = "../dagron-identity" }
# Encrypting environment secrets on write (the engine decrypts at dispatch).
dagron-crypto = { path = "../dagron-crypto" }
dagron-artifact = { path = "../dagron-artifact" }
# The DAG model + the run writer, shared with the engine rather than mirrored.
# This crate used to re-declare the spec types and re-implement submit, which
# silently dropped every task field the mirror had not learned about (fan-out,
# resources, wait, cache, pool, priority, produces, …). `postgres` only — this
# binary is Postgres-only and the two backends are mutually exclusive.
dagron-core = { path = "../dagron-core", default-features = false, features = ["postgres", "ops"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
serde_yaml = "0.9"
petgraph = "0.6"
cron = "0.16"
# IANA timezone database for DST-safe per-schedule cron (matches the engine).
chrono-tz = "0.10"
# Cloud fetch for archived run documents (features `archive-s3`/`-gcs`/`-azure`).
# Backend sub-features (aws/gcp/azure) are enabled by those features.
object_store = { version = "0.11", optional = true }
