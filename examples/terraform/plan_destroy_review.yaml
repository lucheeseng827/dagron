# Terraform destroy: plan the teardown -> human review -> destroy *exactly that plan*.
#
#   init ─▶ plan_destroy ─▶ plan_result ─▶ review (human) ─▶ destroy
#
# Same shape as plan_review_apply.yaml, for the change nobody wants to get wrong.
# `terraform plan -destroy` writes the teardown to a saved plan, the approver reads it
# (`plan/plan.txt`), and `binds` pins the approval to those bytes, so `destroy` runs
# only the plan that was read: `terraform apply <saved destroy plan>`, never a fresh
# `terraform destroy` that could pick up resources added since.
#
# Logs: every step starts `exec 2>&1` and passes `-no-color` (see plan_review_apply.yaml).
#
# approvers / not_triggerer are commented out; enable them where your gateway login
# carries the group. They are enforced by the dagron-api gateway, and `binds` needs
# the gateway's artifact store (DAGRON_ARTIFACT_DIR) to be the one tasks write to.
name: terraform_plan_destroy_review
tags: [terraform, iac, destroy]
max_active_runs: 1
concurrency_key: "{{ tf_dir }}:{{ environment }}"
run_timeout_secs: 21600
parameters:
  tf_dir: "./infra"
  environment: "staging"

param_schema:
  tf_dir:      { required: true, pattern: "[A-Za-z0-9_./-]+", description: "Directory holding the Terraform root module" }
  environment: { required: true, enum: [dev, staging, prod], description: "Environment to destroy" }

tasks:
  - name: init
    command: ["sh", "-c", "exec 2>&1; terraform -chdir='{{ tf_dir }}' init -input=false -no-color"]
    max_attempts: 2
    retry_delay_secs: 10
    timeout_secs: 600

  - name: plan_destroy
    depends_on: [init]
    command:
      - sh
      - -c
      - |
        exec 2>&1
        set -e
        A="${DAGRON_ARTIFACTS:-/tmp/dagron-${DAGRON_RUN_ID:-demo}}/plan"; mkdir -p "$A"
        rm -f "$A/changed"
        terraform -chdir='{{ tf_dir }}' workspace select '{{ environment }}'
        set +e
        terraform -chdir='{{ tf_dir }}' plan -destroy -input=false -no-color -detailed-exitcode -var environment='{{ environment }}' -out="$A/tfplan"
        rc=$?
        set -e
        case "$rc" in
          0) ;;
          2) terraform -chdir='{{ tf_dir }}' show -no-color "$A/tfplan" > "$A/plan.txt"; touch "$A/changed" ;;
          *) exit "$rc" ;;
        esac
    timeout_secs: 1800

  - name: plan_result
    depends_on: [plan_destroy]
    command:
      - sh
      - -c
      - |
        A="${DAGRON_ARTIFACTS:-/tmp/dagron-${DAGRON_RUN_ID:-demo}}/plan"
        if [ -f "$A/changed" ]; then echo changes; else echo no_changes; fi
    timeout_secs: 60

  # Skipped (and so is `destroy`) when there is nothing to tear down.
  - name: review
    type: approval
    depends_on: [plan_result]
    when: "{{ tasks.plan_result.output }} == changes"
    approval_message: "DESTROY: review the teardown plan below. Approving deletes these resources in {{ environment }}."
    approval_show: ["plan/plan.txt"]
    binds: ["plan/tfplan", "plan/plan.txt"]
    # approvers: ["group:platform-admins"]
    # not_triggerer: true
    approval_timeout_secs: 14400
    approval_on_timeout: reject

  - name: destroy
    depends_on: [review]
    command:
      - sh
      - -c
      - |
        exec 2>&1
        set -e
        R="${DAGRON_ARTIFACTS:-/tmp/dagron-${DAGRON_RUN_ID:-demo}}"
        (cd "$R" && sha256sum -c review/approved.sha256)
        terraform -chdir='{{ tf_dir }}' workspace select '{{ environment }}'
        terraform -chdir='{{ tf_dir }}' apply -input=false -no-color "$R/plan/tfplan"
    timeout_secs: 3600
