# Terraform: checks -> plan -> human review -> apply the *reviewed* plan.
#
#   fmt ─────────────────────────────┐
#   init ─┬─▶ validate ──────────────┤
#         ├─▶ lint (tflint) ─────────┼─▶ plan ─▶ plan_result ─▶ review (human) ─▶ apply
#         └─▶ compliance (checkov) ──┘
#
# Logs: every step starts `exec 2>&1` and passes `-no-color`. The run log keeps both
# streams, but two pipes are read as their lines arrive, so terraform's stderr
# diagnostics can land a line or two away from the stdout they belong to; merging them
# in the shell keeps the order terraform wrote. (Engines before the `task_runs.log`
# column dropped a successful task's stderr entirely, which this also covers.) The log
# view shows 2000 lines by default (raise `max`, up to 50000, or use `tail`);
# `plan/plan.txt` is the full plan regardless.
#
# What the approval gate adds here:
#   approval_show     the plan text is offered to the approver as a link on the
#                     Approvals page, so they read the change before deciding.
#   approval_message  says what is about to happen and to which environment.
#   decided_by /      who approved and why is recorded on the gate and shows in
#   decision_comment  the run detail (`timeout` if nobody answered).
#   on_timeout        rejects: an unanswered production apply must not proceed.
#
#   binds             pins the approval to the exact bytes reviewed: the Approvals page
#                     sends back the sha256 it showed, the gateway refuses (409) if the
#                     plan changed since, and on approval it writes
#                     `review/approved.sha256` -- which `apply` checks with `sha256sum -c`
#                     before touching anything. Terraform's own refusal of a stale saved
#                     plan stays as a second net.
#   param_schema /    constrain what a caller may pass (`environment` is one of
#   concurrency_key   dev|staging|prod, `tf_dir` a plain path), and serialise runs per
#                     stack: two stacks plan in parallel, two runs of one never do.
#   approvers /       who may approve (email or `group:<name>`), and whether the person
#   not_triggerer     who started the run is barred from approving it. Commented out
#                     below: enable them once your gateway login carries the group.
#                     Enforced by the dagron-api gateway (the engine API refuses to
#                     decide a gate that sets them), and
#                     binds needs the gateway's artifact store (DAGRON_ARTIFACT_DIR)
#                     to be the one the tasks write to.
#
# Assumes every task runs where `tf_dir` is checked out and shares one
# filesystem (a single worker, or a shared volume): `init` leaves `.terraform/`
# in place for the later steps. Each environment is a Terraform workspace, and the root
# module declares a variable named `environment`.
name: terraform_plan_review_apply
tags: [terraform, iac]
max_active_runs: 1                  # with concurrency_key: one run at a time per stack
concurrency_key: "{{ tf_dir }}:{{ environment }}"
run_timeout_secs: 21600
parameters:
  tf_dir: "./infra"
  environment: "staging"

# Checked when a run is triggered (UI, API, MCP, schedule): a value outside these
# rules is a 400 before any task exists. tf_dir is spliced into `sh -c` strings
# below, so its pattern is also what keeps a caller from injecting shell.
param_schema:
  tf_dir:      { required: true, pattern: "[A-Za-z0-9_./-]+", description: "Directory holding the Terraform root module" }
  environment: { required: true, enum: [dev, staging, prod], description: "Environment to plan and apply" }

tasks:
  - name: fmt
    command: ["sh", "-c", "exec 2>&1; terraform -chdir='{{ tf_dir }}' fmt -no-color -check -recursive -diff"]
    timeout_secs: 120

  - name: init
    command: ["sh", "-c", "exec 2>&1; terraform -chdir='{{ tf_dir }}' init -input=false -no-color"]
    max_attempts: 2
    retry_delay_secs: 10
    timeout_secs: 600

  - name: validate
    depends_on: [init]
    command: ["sh", "-c", "exec 2>&1; terraform -chdir='{{ tf_dir }}' validate -no-color"]
    timeout_secs: 120

  - name: lint
    depends_on: [init]
    command: ["sh", "-c", "exec 2>&1; cd '{{ tf_dir }}' && tflint --recursive --no-color"]
    timeout_secs: 300

  - name: compliance
    depends_on: [init]
    command: ["sh", "-c", "exec 2>&1; checkov -d '{{ tf_dir }}' --quiet --compact"]
    timeout_secs: 600

  # The whole terraform plan is this task's log (stdout and stderr merged in order
  # by `exec 2>&1`). It also writes the plan where the approver can read it: `plan/plan.txt`
  # under the run's artifact dir is the artifact key `plan/plan.txt`. Whether there
  # is anything to apply goes in a marker file, read by `plan_result`, so this
  # task's output stays the plan rather than a single word.
  - name: plan
    depends_on: [fmt, validate, lint, compliance]
    command:
      - sh
      - -c
      - |
        exec 2>&1
        set -e
        A="${DAGRON_ARTIFACTS:-/tmp/dagron-${DAGRON_RUN_ID:-demo}}/plan"; mkdir -p "$A"
        rm -f "$A/changed"
        terraform -chdir='{{ tf_dir }}' workspace select -or-create '{{ environment }}'
        set +e
        terraform -chdir='{{ tf_dir }}' plan -input=false -no-color -detailed-exitcode -var environment='{{ environment }}' -out="$A/tfplan"
        rc=$?
        set -e
        case "$rc" in
          0) ;;
          2) terraform -chdir='{{ tf_dir }}' show -no-color "$A/tfplan" > "$A/plan.txt"; touch "$A/changed" ;;
          *) exit "$rc" ;;
        esac
    timeout_secs: 1800

  - name: plan_result
    depends_on: [plan]
    command:
      - sh
      - -c
      - |
        A="${DAGRON_ARTIFACTS:-/tmp/dagron-${DAGRON_RUN_ID:-demo}}/plan"
        if [ -f "$A/changed" ]; then echo changes; else echo no_changes; fi
    timeout_secs: 60

  # Skipped (and so is `apply`) when the plan found nothing to change.
  - name: review
    type: approval
    depends_on: [plan_result]
    when: "{{ tasks.plan_result.output }} == changes"
    approval_message: "Review the Terraform plan below, then apply it to {{ environment }}."
    approval_show: ["plan/plan.txt"]
    binds: ["plan/tfplan", "plan/plan.txt"]   # what apply will run, and what the approver read
    # approvers: ["group:release"]
    # not_triggerer: true
    approval_timeout_secs: 14400
    approval_on_timeout: reject

  - name: apply
    depends_on: [review]
    command:
      - sh
      - -c
      - |
        exec 2>&1
        set -e
        R="${DAGRON_ARTIFACTS:-/tmp/dagron-${DAGRON_RUN_ID:-demo}}"
        # Refuse anything but the plan the approver's digests covered.
        (cd "$R" && sha256sum -c review/approved.sha256)
        terraform -chdir='{{ tf_dir }}' workspace select '{{ environment }}'
        terraform -chdir='{{ tf_dir }}' apply -input=false -no-color "$R/plan/tfplan"
    timeout_secs: 3600
