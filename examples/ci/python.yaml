# A starter pipeline for a Python project. Copy it to .dagron/ci/ci.yaml in
# the repository, and check it with `dagron-ci validate`.
#
# A push to main and a pull request run one job: make a virtual
# environment in the workspace, install the project and its requirements
# into it, and run pytest. The job is a container that starts with the
# commit checked out, and runs its steps in order in that one workspace; a
# step that fails ends the job.
#
# pytest writes what it ran to junit.xml, and the job says it when its
# steps are over: where the repository's jobs are check runs, a test that
# failed is an annotation on its line of the commit.
#
# A pull request runs when it comes from one of the repository's own
# branches and its author is the repository's owner, a member of its
# organization or a collaborator. One from a fork, or by anyone else, runs
# nothing: its commit gets one status that says so.
#
# The job starts cold. There is no cache between runs yet, so pip downloads
# every dependency every time.
name: ci
on:
  push: { branches: [main] }
  pull_request: {}
task_defaults:
  # A job that runs longer than this is stopped, and fails.
  timeout_secs: 1800
tasks:
  - name: test
    docker_image: docker.io/library/python:3.12-slim
    # A job's env is a list of names and values. (A step's is a map.)
    env:
      # Nothing is kept between runs, and a job may run as a user with no
      # home directory to keep it in.
      - { name: PIP_NO_CACHE_DIR, value: "1" }
      - { name: PIP_DISABLE_PIP_VERSION_CHECK, value: "1" }
    steps:
      # Each step is a shell of its own, so the environment is not activated:
      # its tools are named by their path. A virtual environment keeps the
      # install off the image, which a job that is not root cannot write to.
      - name: install
        run: |
          python -m venv .venv
          if [ -f requirements.txt ]; then .venv/bin/pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then .venv/bin/pip install -e .; fi
          .venv/bin/pip install pytest
      # The older of pytest's two report formats is the one that says which
      # file and line a test is at. pytest counts a line from 0, and the
      # report is read so where its suite is named `pytest`: the name is
      # set here, so that a project's own setting does not change it.
      - name: test
        run: .venv/bin/pytest --junitxml=junit.xml -o junit_family=xunit1 -o junit_suite_name=pytest
    report:
      junit: junit.xml
