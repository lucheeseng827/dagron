# A starter pipeline for a Rust project. Copy it to .dagron/ci/ci.yaml in the
# repository, and check it with `dagron-ci validate`.
#
# A push to main and a pull request run two jobs side by side: one
# checks the format and lints, one runs the tests. Each job is a container
# that starts with the commit checked out, and runs its steps in order in
# that one workspace; a step that fails ends its job.
#
# A pull request runs when it comes from one of the repository's own
# branches and its author is the repository's owner, a member of its
# organization or a collaborator. One from a fork, or by anyone else, runs
# nothing: its commit gets one status that says so.
#
# Each job starts cold. There is no cache between runs yet, so both jobs
# download the dependencies and compile them every time.
name: ci
on:
  push: { branches: [main] }
  pull_request: {}
task_defaults:
  # A job that runs longer than this is stopped, and fails.
  timeout_secs: 2700
tasks:
  - name: lint
    docker_image: docker.io/library/rust:1-bookworm
    steps:
      # The official image carries rustc and cargo, and neither of these.
      - name: toolchain
        run: rustup component add rustfmt clippy
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
  - name: test
    docker_image: docker.io/library/rust:1-bookworm
    steps:
      # Add --locked once Cargo.lock is committed, so that a run builds what
      # was reviewed.
      - name: test
        run: cargo test --workspace
