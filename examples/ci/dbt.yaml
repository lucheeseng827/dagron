# A starter pipeline for a dbt project, with a Postgres of the job's own for
# its warehouse. Copy it to .dagron/ci/ci.yaml in the repository, and check
# it with `dagron-ci validate`.
#
# A push to main and a pull request run one job: `dbt build`, which runs
# the project's seeds, models, snapshots and tests in the order they depend
# on one another, against a database that is started beside the job and
# removed with it. The job is a container that starts with the commit
# checked out, and runs its steps in order in that one workspace; a step
# that fails ends the job.
#
# The project needs a profile that reads its connection from the job's
# variables, kept in the repository beside dbt_project.yml. The README
# beside this file has one.
#
# A pull request runs when it comes from one of the repository's own
# branches and its author is the repository's owner, a member of its
# organization or a collaborator. One from a fork, or by anyone else, runs
# nothing: its commit gets one status that says so.
#
# The job starts cold. There is no cache between runs yet, so pip downloads
# dbt every time, and every model is built from nothing.
name: ci
on:
  push: { branches: [main] }
  pull_request: {}
task_defaults:
  # A job that runs longer than this is stopped, and fails.
  timeout_secs: 1800
tasks:
  - name: build
    docker_image: docker.io/library/python:3.12-slim
    # A job's env is a list of names and values. (A step's is a map.)
    env:
      # Nothing is kept between runs, and a job may run as a user with no
      # home directory to keep it in: pip's cache, and the id dbt would
      # write there to count its users by.
      - { name: PIP_NO_CACHE_DIR, value: "1" }
      - { name: PIP_DISABLE_PIP_VERSION_CHECK, value: "1" }
      - { name: DBT_SEND_ANONYMOUS_USAGE_STATS, value: "False" }
      # A log is read as text: no colour codes in it.
      - { name: DBT_USE_COLORS, value: "False" }
      # dbt reads the repository's own profiles.yml, which reads these. The
      # database is the job's, and goes with it: its password is no secret.
      - { name: DBT_PROFILES_DIR, value: . }
      - { name: DBT_HOST, value: db }
      - { name: DBT_PASSWORD, value: ci }
    # A container beside the job, started before its first step and seen
    # ready, reached at its name, and removed with the job.
    services:
      - name: db
        image: docker.io/library/postgres:16-alpine
        env:
          - { name: POSTGRES_PASSWORD, value: ci }
        ready: pg_isready -h localhost -U postgres
    steps:
      # Each step is a shell of its own, so the environment is not activated:
      # its tools are named by their path.
      - name: install
        run: |
          python -m venv .venv
          .venv/bin/pip install dbt-postgres
      # The packages the project names, where it names any.
      - name: packages
        run: if [ -f packages.yml ]; then .venv/bin/dbt deps; fi
      - name: build
        run: .venv/bin/dbt build
