# A template library for infrastructure-as-code: Terraform, OpenTofu and Pulumi.
#
# This is a *library*, not a workflow you run. Save it once under the name
# `iac-library`; any workflow then imports what it needs with
#
#     use: [iac-library]            # every template below
#     use: [iac-library/tf_stage]   # one template (plus the ones it calls)
#
# and calls a template with `template:` + `arguments:`, instead of carrying a
# hundred-line `templates:` block of its own. See examples/iac/README.md.
#
#   tf_checks      fmt, init, validate, lint, compliance        (Terraform / OpenTofu)
#   tf_stage       plan, destroy guard, review, apply            (Terraform / OpenTofu)
#   pulumi_stage   preview, destroy guard, review, apply         (Pulumi)
#
# `tool` picks the binary for the first two: `terraform` or `tofu`. OpenTofu keeps
# the CLI surface these templates use (`-chdir`, `workspace select -or-create`,
# `-detailed-exitcode`, `show -json`), so it needs OpenTofu 1.6 or newer and
# nothing else.
#
# Both stage templates keep the same contract, so a caller reads the same either way:
#   - name the call after the environment (`- name: staging`, `env: staging`): the
#     approval lands in `$DAGRON_ARTIFACTS/<call>.review/`, which `apply` reads as
#     `{{ env }}.review`;
#   - `gated: "false"` removes the review (and so the human) from that stage;
#   - a plan that deletes or replaces anything fails unless `allow_destroy: "true"`;
#   - `plan` leaves a `changed` marker; with nothing to change the review and apply
#     are skipped and the stage still completes;
#   - a stage ends in `done`, which succeeds when the plan was applied or changed
#     nothing, and is skipped when the plan failed, the review was rejected or the
#     apply failed. Give a later stage's `depends_on` the earlier call and it starts
#     only after `done`, so a stage that did not finish never promotes;
#   - the approver reads `plan_<env>/plan.txt`, `binds` pins the approval to the
#     exact bytes shown, and `apply` re-checks them before touching anything.
# Every task runs where the stack's directory is checked out and shares one
# filesystem (a single worker, or a shared volume). `tf_stage` also needs `jq` on the
# worker's PATH: its destroy guard reads the plan's JSON.
#
# Pulumi caveat: Terraform applies the very plan file that was reviewed. Pulumi's
# saved plans are still experimental, so `pulumi_stage` binds the reviewed preview
# and a summary of its changes instead, and `apply` re-previews and refuses to run
# if the summary moved since the review. That is a weaker guarantee than a saved
# plan: it catches drift, not a different change with the same counts. It also
# needs `jq`, a logged-in backend and `PULUMI_CONFIG_PASSPHRASE` (or a KMS secrets
# provider) in the task environment. These steps follow the Pulumi CLI's
# documented `preview --json` / `up --skip-preview` surface; run them against a
# scratch stack before trusting them with production.
name: iac-library
tags: [library, iac]
# `tasks:` is required on every workflow; a library has none.
tasks: []

templates:
  # ---- Terraform / OpenTofu ------------------------------------------------
  - name: tf_checks
    parameters:
      tool: terraform
      tf_dir: ""
    tasks:
      - name: fmt
        command: ["sh", "-c", "exec 2>&1; {{ tool }} -chdir='{{ tf_dir }}' fmt -no-color -check -recursive -diff"]
        timeout_secs: 120

      - name: init
        command: ["sh", "-c", "exec 2>&1; {{ tool }} -chdir='{{ tf_dir }}' init -input=false -no-color"]
        max_attempts: 2
        retry_delay_secs: 10
        timeout_secs: 600

      - name: validate
        depends_on: [init]
        command: ["sh", "-c", "exec 2>&1; {{ tool }} -chdir='{{ tf_dir }}' validate -no-color"]
        timeout_secs: 120

      - name: lint
        depends_on: [init]
        command: ["sh", "-c", "exec 2>&1; cd '{{ tf_dir }}' && tflint --recursive --no-color"]
        timeout_secs: 300

      - name: compliance
        depends_on: [init]
        command: ["sh", "-c", "exec 2>&1; checkov -d '{{ tf_dir }}' --quiet --compact"]
        timeout_secs: 600

  # One environment: plan, and if it changes anything, (review and) apply.
  - name: tf_stage
    parameters:
      tool: terraform
      env: ""
      gated: "true"
      message: ""
      tf_dir: ""
      allow_destroy: "false"
    tasks:
      - name: plan
        command:
          - sh
          - -c
          - |
            exec 2>&1
            set -e
            A="${DAGRON_ARTIFACTS:-/tmp/dagron-${DAGRON_RUN_ID:-demo}}/plan_{{ env }}"; mkdir -p "$A"
            rm -f "$A/changed"
            {{ tool }} -chdir='{{ tf_dir }}' workspace select -or-create '{{ env }}'
            set +e
            {{ tool }} -chdir='{{ tf_dir }}' plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -var environment='{{ env }}' -out="$A/tfplan"
            rc=$?
            set -e
            case "$rc" in
              0) ;;
              2)
                {{ tool }} -chdir='{{ tf_dir }}' show -no-color "$A/tfplan" > "$A/plan.txt"
                # Resource deletions only. `actions` also appears under `output_changes` and
                # `resource_drift`, so counting every `"actions"` refuses a deploy that merely drops
                # an output, or re-creates something deleted outside Terraform. A replace is
                # ["delete","create"], so it still counts. Fail closed: `show` is captured on its own
                # because in `show | jq` the pipeline's status is jq's, so a failed `show` would hand
                # jq an empty stream, leave n empty, and the `[ ... ]` below would only error inside
                # an `&&` list, where set -e does not stop the step. Held in a variable, not a file:
                # the JSON carries sensitive values in clear and everything under $A is an artifact.
                # `jq -e` also fails on empty input, so a missing jq or a non-JSON plan stops here too.
                plan_json=$({{ tool }} -chdir='{{ tf_dir }}' show -json "$A/tfplan")
                n=$(printf '%s' "$plan_json" | jq -e '[.resource_changes[]? | select(any(.change.actions[]; . == "delete"))] | length')
                echo "resources this plan deletes or replaces: $n"
                if [ "$n" -gt 0 ] && [ "{{ allow_destroy }}" != "true" ]; then
                  echo "refusing: pass allow_destroy=true to permit deletions"; exit 3
                fi
                touch "$A/changed" ;;
              *) exit "$rc" ;;
            esac
        timeout_secs: 1800

      - name: changed
        depends_on: [plan]
        command: [sh, -c, 'A="${DAGRON_ARTIFACTS:-/tmp/dagron-${DAGRON_RUN_ID:-demo}}/plan_{{ env }}"; if [ -f "$A/changed" ]; then echo changes; else echo no_changes; fi']
        timeout_secs: 60

      - name: review
        type: approval
        depends_on: [changed]
        when: "{{ gated }} == true and {{ tasks.changed.output }} == changes"
        approval_message: "{{ message }}"
        approval_show: ["plan_{{ env }}/plan.txt"]
        binds: ["plan_{{ env }}/tfplan", "plan_{{ env }}/plan.txt"]
        # approvers: ["group:release"]
        # not_triggerer: true
        approval_timeout_secs: 14400
        approval_on_timeout: reject

      - name: apply
        depends_on: [changed, review]
        when: "{{ tasks.changed.output }} == changes"
        command:
          - sh
          - -c
          - |
            exec 2>&1
            set -e
            R="${DAGRON_ARTIFACTS:-/tmp/dagron-${DAGRON_RUN_ID:-demo}}"
            if [ "{{ gated }}" = "true" ]; then
              (cd "$R" && sha256sum -c "{{ env }}.review/approved.sha256")
            fi
            {{ tool }} -chdir='{{ tf_dir }}' workspace select '{{ env }}'
            {{ tool }} -chdir='{{ tf_dir }}' apply -input=false -no-color -lock-timeout=5m "$R/plan_{{ env }}/tfplan"
        timeout_secs: 3600

      # The stage's exit, so the next call starts after it. It runs when the plan was
      # applied or changed nothing. It is skipped when the review was rejected or the
      # apply failed (`none_failed`), or when the plan failed or never ran (`changed`
      # then has no output, so the `when` is false). `apply` alone cannot tell these
      # apart: it is skipped both when nothing changed and when the review was
      # rejected. `==`, not `in [..]`: with an empty left side, `in` currently
      # evaluates true.
      - name: done
        depends_on: [changed, review, apply]
        trigger_rule: none_failed
        when: "{{ tasks.changed.output }} == changes or {{ tasks.changed.output }} == no_changes"
        command: [sh, -c, "echo '{{ env }}: done'"]
        timeout_secs: 60

  # ---- Pulumi --------------------------------------------------------------
  # `env` is the Pulumi stack name; `pulumi_dir` holds Pulumi.yaml.
  - name: pulumi_stage
    parameters:
      env: ""
      gated: "true"
      message: ""
      pulumi_dir: ""
      allow_destroy: "false"
    tasks:
      - name: plan
        command:
          - sh
          - -c
          - |
            exec 2>&1
            set -e
            A="${DAGRON_ARTIFACTS:-/tmp/dagron-${DAGRON_RUN_ID:-demo}}/plan_{{ env }}"; mkdir -p "$A"
            rm -f "$A/changed"
            pulumi preview --cwd '{{ pulumi_dir }}' --stack '{{ env }}' --non-interactive --color never --json > "$A/preview.json"
            jq -S -c '.changeSummary // {}' "$A/preview.json" > "$A/summary.json"
            jq -r '.steps[] | select(.op != "same") | "\(.op)\t\(.urn)"' "$A/preview.json" > "$A/plan.txt"
            cat "$A/plan.txt"
            n=$(jq '[.steps[] | select(.op == "delete" or .op == "replace" or .op == "delete-replaced")] | length' "$A/preview.json")
            echo "resources this preview deletes or replaces: $n"
            if [ "$n" -gt 0 ] && [ "{{ allow_destroy }}" != "true" ]; then
              echo "refusing: pass allow_destroy=true to permit deletions"; exit 3
            fi
            if [ -s "$A/plan.txt" ]; then touch "$A/changed"; fi
        timeout_secs: 1800

      - name: changed
        depends_on: [plan]
        command: [sh, -c, 'A="${DAGRON_ARTIFACTS:-/tmp/dagron-${DAGRON_RUN_ID:-demo}}/plan_{{ env }}"; if [ -f "$A/changed" ]; then echo changes; else echo no_changes; fi']
        timeout_secs: 60

      - name: review
        type: approval
        depends_on: [changed]
        when: "{{ gated }} == true and {{ tasks.changed.output }} == changes"
        approval_message: "{{ message }}"
        approval_show: ["plan_{{ env }}/plan.txt"]
        binds: ["plan_{{ env }}/summary.json", "plan_{{ env }}/plan.txt"]
        # approvers: ["group:release"]
        # not_triggerer: true
        approval_timeout_secs: 14400
        approval_on_timeout: reject

      - name: apply
        depends_on: [changed, review]
        when: "{{ tasks.changed.output }} == changes"
        command:
          - sh
          - -c
          - |
            exec 2>&1
            set -e
            R="${DAGRON_ARTIFACTS:-/tmp/dagron-${DAGRON_RUN_ID:-demo}}"
            A="$R/plan_{{ env }}"
            if [ "{{ gated }}" = "true" ]; then
              (cd "$R" && sha256sum -c "{{ env }}.review/approved.sha256")
            fi
            # Pulumi cannot apply a reviewed plan file, so check the stack still
            # previews to what the approver read before applying anything.
            pulumi preview --cwd '{{ pulumi_dir }}' --stack '{{ env }}' --non-interactive --color never --json > "$A/preview.now.json"
            jq -S -c '.changeSummary // {}' "$A/preview.now.json" > "$A/summary.now.json"
            if ! cmp -s "$A/summary.json" "$A/summary.now.json"; then
              echo "refusing: the stack no longer previews to what was reviewed"
              echo "reviewed: $(cat "$A/summary.json")"
              echo "now:      $(cat "$A/summary.now.json")"
              exit 4
            fi
            pulumi up --cwd '{{ pulumi_dir }}' --stack '{{ env }}' --non-interactive --color never --skip-preview --yes
        timeout_secs: 3600

      # The stage's exit, so the next call starts after it. It runs when the plan was
      # applied or changed nothing. It is skipped when the review was rejected or the
      # apply failed (`none_failed`), or when the plan failed or never ran (`changed`
      # then has no output, so the `when` is false). `apply` alone cannot tell these
      # apart: it is skipped both when nothing changed and when the review was
      # rejected. `==`, not `in [..]`: with an empty left side, `in` currently
      # evaluates true.
      - name: done
        depends_on: [changed, review, apply]
        trigger_rule: none_failed
        when: "{{ tasks.changed.output }} == changes or {{ tasks.changed.output }} == no_changes"
        command: [sh, -c, "echo '{{ env }}: done'"]
        timeout_secs: 60
