<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dagron · System context</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2efe6;   /* paint-white */
      --color-ink:     #0e1013;   /* hall-black */
      --color-muted:   #3d434b;   /* steel-hi */
      --color-accent:  #965d04;   /* deep amber */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · dagron</p>
    <h1>System context — the datastore is the source of truth</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dagron-system-context-title dagron-system-context-desc">
      <title id="dagron-system-context-title">dagron system context</title>
      <desc id="dagron-system-context-desc">Architecture diagram showing a browser and an AI agent reaching dagron through a JWT-gated API edge that also serves the operator console, DAG YAML submitted directly as a file or a watched directory, one datastore holding all workflow state, and N identical scheduler processes that claim work from that datastore with no coordinator and run each task as a subprocess, container, or pod.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3d434b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#965d04"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f5d99"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2efe6"/>

      <!-- ============ Zones (z-order: bg -> zones -> arrows -> nodes) ============ -->

      <!-- Zone: Clients -->
      <rect x="40" y="120" width="176" height="392" rx="8"
            fill="rgba(14,16,19,0.02)" stroke="rgba(14,16,19,0.10)" stroke-width="0.8"/>
      <rect x="56" y="124" width="56" height="12" rx="2" fill="#f2efe6"/>
      <text x="84" y="133" fill="rgba(14,16,19,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">CLIENTS</text>

      <!-- Zone: Edge -->
      <rect x="272" y="120" width="192" height="264" rx="8"
            fill="rgba(14,16,19,0.02)" stroke="rgba(14,16,19,0.10)" stroke-width="0.8"/>
      <rect x="288" y="124" width="40" height="12" rx="2" fill="#f2efe6"/>
      <text x="308" y="133" fill="rgba(14,16,19,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">EDGE</text>

      <!-- ============ Connectors (before boxes, so z-order puts them behind) ============ -->

      <!-- Browser -> dagron-api -->
      <line x1="200" y1="188" x2="288" y2="188" stroke="#2f5d99" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- AI agent -> dagron-mcp -->
      <line x1="200" y1="332" x2="288" y2="332" stroke="#2f5d99" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- dagron-mcp -> dagron-api: the agent fronts the same authenticated edge -->
      <line x1="368" y1="296" x2="368" y2="224" stroke="#2f5d99" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- dagron-api -> datastore (two-bend elbow, r=8) -->
      <path d="M 448,188 H 476 Q 484,188 484,196 V 264 Q 484,272 492,272 H 520"
            fill="none" stroke="#3d434b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- DAG YAML -> scheduler: bypasses the edge entirely, enters from below -->
      <path d="M 200,460 H 900 Q 908,460 908,452 V 352"
            fill="none" stroke="#3d434b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Scheduler -> datastore: the claim, the primary interaction -->
      <line x1="832" y1="272" x2="744" y2="272" stroke="#3d434b" stroke-width="1.4" marker-end="url(#arrow)"/>
      <!-- Datastore -> scheduler: commit-ordered wake -->
      <line x1="744" y1="312" x2="832" y2="312" stroke="#3d434b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- Scheduler -> task targets -->
      <line x1="1032" y1="292" x2="1096" y2="292" stroke="#3d434b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Arrow labels (masked, 8-12px clear of the stroke) ============ -->

      <rect x="216" y="168" width="56" height="12" rx="2" fill="#f2efe6"/>
      <text x="244" y="177" fill="#2f5d99" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS · JWT</text>

      <rect x="216" y="312" width="56" height="12" rx="2" fill="#f2efe6"/>
      <text x="244" y="321" fill="#2f5d99" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MCP · STDIO</text>

      <rect x="378" y="254" width="60" height="12" rx="2" fill="#f2efe6"/>
      <text x="408" y="263" fill="#2f5d99" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP · JWT</text>

      <rect x="494" y="208" width="52" height="12" rx="2" fill="#f2efe6"/>
      <text x="520" y="217" fill="#3d434b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ · SSE</text>

      <rect x="240" y="440" width="56" height="12" rx="2" fill="#f2efe6"/>
      <text x="268" y="449" fill="#3d434b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE_RUN</text>

      <rect x="748" y="248" width="80" height="12" rx="2" fill="#f2efe6"/>
      <text x="788" y="257" fill="#3d434b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM · MARK</text>

      <rect x="756" y="320" width="64" height="12" rx="2" fill="#f2efe6"/>
      <text x="788" y="329" fill="#3d434b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOTIFY</text>

      <rect x="1036" y="272" width="56" height="12" rx="2" fill="#f2efe6"/>
      <text x="1064" y="281" fill="#3d434b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXECUTE</text>

      <!-- ============ Editorial callout (1 of max 2) ============ -->

      <text x="900" y="176" fill="#3d434b" font-size="14" font-style="italic"
            font-family="'Instrument Serif', serif" text-anchor="end">every scheduling decision is a SQL transition</text>
      <path d="M 760,186 Q 720,204 676,232" fill="none"
            stroke="rgba(14,16,19,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="676" cy="232" r="2" fill="#0e1013"/>

      <!-- ============ Nodes ============ -->

      <!-- Browser (input) -->
      <rect x="56" y="152" width="144" height="72" rx="6" fill="#f2efe6"/>
      <rect x="56" y="152" width="144" height="72" rx="6" fill="rgba(61,67,75,0.10)" stroke="#7d8792" stroke-width="1"/>
      <rect x="64" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,135,146,0.40)" stroke-width="0.8"/>
      <text x="78" y="167" fill="#3d434b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="128" y="192" fill="#0e1013" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
      <text x="128" y="208" fill="#3d434b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">console + API</text>

      <!-- AI agent (input) -->
      <rect x="56" y="296" width="144" height="72" rx="6" fill="#f2efe6"/>
      <rect x="56" y="296" width="144" height="72" rx="6" fill="rgba(61,67,75,0.10)" stroke="#7d8792" stroke-width="1"/>
      <rect x="64" y="302" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,135,146,0.40)" stroke-width="0.8"/>
      <text x="78" y="311" fill="#3d434b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
      <text x="128" y="336" fill="#0e1013" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI agent</text>
      <text x="128" y="352" fill="#3d434b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MCP client</text>

      <!-- DAG YAML (input) -->
      <rect x="56" y="424" width="144" height="72" rx="6" fill="#f2efe6"/>
      <rect x="56" y="424" width="144" height="72" rx="6" fill="rgba(61,67,75,0.10)" stroke="#7d8792" stroke-width="1"/>
      <rect x="64" y="430" width="28" height="12" rx="2" fill="transparent" stroke="rgba(125,135,146,0.40)" stroke-width="0.8"/>
      <text x="78" y="439" fill="#3d434b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YAML</text>
      <text x="128" y="464" fill="#0e1013" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DAG YAML</text>
      <text x="128" y="480" fill="#3d434b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">file or directory</text>

      <!-- dagron-api (backend) -->
      <rect x="288" y="152" width="160" height="72" rx="6" fill="#f2efe6"/>
      <rect x="288" y="152" width="160" height="72" rx="6" fill="#ffffff" stroke="#0e1013" stroke-width="1"/>
      <rect x="296" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(14,16,19,0.40)" stroke-width="0.8"/>
      <text x="310" y="167" fill="#0e1013" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="368" y="186" fill="#0e1013" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dagron-api</text>
      <text x="368" y="201" fill="#3d434b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">axum · JWT · SSE</text>
      <text x="368" y="214" fill="#3d434b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">console at / · API /api</text>

      <!-- dagron-mcp (backend) -->
      <rect x="288" y="296" width="160" height="72" rx="6" fill="#f2efe6"/>
      <rect x="288" y="296" width="160" height="72" rx="6" fill="#ffffff" stroke="#0e1013" stroke-width="1"/>
      <rect x="296" y="302" width="28" height="12" rx="2" fill="transparent" stroke="rgba(14,16,19,0.40)" stroke-width="0.8"/>
      <text x="310" y="311" fill="#0e1013" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="368" y="336" fill="#0e1013" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dagron-mcp</text>
      <text x="368" y="352" fill="#3d434b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JSON-RPC · stdio</text>

      <!-- Datastore (FOCAL 1 of 2) -->
      <rect x="520" y="232" width="224" height="120" rx="6" fill="#f2efe6"/>
      <rect x="520" y="232" width="224" height="120" rx="6" fill="rgba(245,166,35,0.20)" stroke="#965d04" stroke-width="1"/>
      <rect x="528" y="238" width="92" height="12" rx="2" fill="transparent" stroke="rgba(150,93,4,0.50)" stroke-width="0.8"/>
      <text x="574" y="247" fill="#965d04" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE OF TRUTH</text>
      <text x="632" y="280" fill="#0e1013" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Datastore</text>
      <text x="632" y="300" fill="#3d434b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workflow_runs · task_runs</text>
      <text x="632" y="316" fill="#3d434b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">task_dependencies · dead_letters</text>

      <!-- Scheduler xN (FOCAL 2 of 2) -->
      <rect x="832" y="232" width="200" height="120" rx="6" fill="#f2efe6"/>
      <rect x="832" y="232" width="200" height="120" rx="6" fill="rgba(245,166,35,0.20)" stroke="#965d04" stroke-width="1"/>
      <rect x="840" y="238" width="92" height="12" rx="2" fill="transparent" stroke="rgba(150,93,4,0.50)" stroke-width="0.8"/>
      <text x="886" y="247" fill="#965d04" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO COORDINATOR</text>
      <text x="932" y="280" fill="#0e1013" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scheduler ×N</text>
      <text x="932" y="300" fill="#3d434b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reconcile loop + pool</text>
      <text x="932" y="316" fill="#3d434b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SKIP LOCKED · lease</text>

      <!-- Task targets (external) -->
      <rect x="1096" y="232" width="144" height="120" rx="6" fill="#f2efe6"/>
      <rect x="1096" y="232" width="144" height="120" rx="6" fill="rgba(14,16,19,0.03)" stroke="rgba(14,16,19,0.30)" stroke-width="1"/>
      <rect x="1104" y="238" width="32" height="12" rx="2" fill="transparent" stroke="rgba(14,16,19,0.22)" stroke-width="0.8"/>
      <text x="1120" y="247" fill="#3d434b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXEC</text>
      <text x="1168" y="280" fill="#0e1013" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Task targets</text>
      <text x="1168" y="300" fill="#3d434b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">subprocess · Docker</text>
      <text x="1168" y="316" fill="#3d434b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Kubernetes Pod</text>

      <!-- ============ Legend strip ============ -->

      <line x1="40" y1="604" x2="1240" y2="604" stroke="rgba(14,16,19,0.12)" stroke-width="0.8"/>
      <text x="40" y="620" fill="#3d434b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="640" width="14" height="10" rx="2" fill="rgba(245,166,35,0.20)" stroke="#965d04" stroke-width="1"/>
      <text x="60" y="648" fill="#3d434b" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>

      <rect x="160" y="640" width="14" height="10" rx="2" fill="#ffffff" stroke="#0e1013" stroke-width="1"/>
      <text x="180" y="648" fill="#3d434b" font-size="8.5" font-family="'Geist', sans-serif">Gateway / service</text>

      <rect x="340" y="640" width="14" height="10" rx="2" fill="rgba(61,67,75,0.10)" stroke="#7d8792" stroke-width="1"/>
      <text x="360" y="648" fill="#3d434b" font-size="8.5" font-family="'Geist', sans-serif">Client / input</text>

      <rect x="500" y="640" width="14" height="10" rx="2" fill="rgba(14,16,19,0.03)" stroke="rgba(14,16,19,0.30)" stroke-width="1"/>
      <text x="520" y="648" fill="#3d434b" font-size="8.5" font-family="'Geist', sans-serif">Execution target</text>

      <line x1="680" y1="645" x2="708" y2="645" stroke="#2f5d99" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="716" y="648" fill="#3d434b" font-size="8.5" font-family="'Geist', sans-serif">Authenticated edge</text>

      <line x1="880" y1="645" x2="908" y2="645" stroke="#3d434b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="1060" y1="645" x2="1088" y2="645" stroke="#3d434b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="1096" y="648" fill="#3d434b" font-size="8.5" font-family="'Geist', sans-serif">Wake / notify</text>

  </div>
</body>
