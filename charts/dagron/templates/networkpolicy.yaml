{{- if .Values.networkPolicy.enabled }}
# The engine's ops API (POST /runs, /runs/{id}/cancel, /rerun, approve …) has NO authentication of its
# own, and neither has Postgres beyond its password. Without these policies any pod in the cluster —
# including the task pods, which run workflow-author code — can submit arbitrary runs and reach the
# datastore. Ingress only; see docs/HARDENING.md for what this does not cover. A CNI that does not
# enforce NetworkPolicy ignores these objects (harmless, and protects nothing).
{{- /* An ingress rule with an empty `from` allows EVERY source, so no peers means no rule at all
       (`ingress: []` = deny all), never `from: []`. */}}
{{- $engineFrom := list }}
{{- if .Values.networkPolicy.engine.monitoringNamespace }}
{{- $engineFrom = append $engineFrom (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .Values.networkPolicy.engine.monitoringNamespace))) }}
{{- end }}
{{- range .Values.networkPolicy.engine.allowFrom }}{{ $engineFrom = append $engineFrom . }}{{- end }}
{{- $ciHere := eq (include "dagron.ci.inEnginePod" .) "true" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dagron.fullname" . }}-engine
  labels:
    {{- include "dagron.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: engine
  policyTypes: [Ingress]
  {{- if or $engineFrom $ciHere }}
  ingress:
    {{- if $engineFrom }}
    - from:
        {{- toYaml $engineFrom | nindent 8 }}
      ports:
        - {port: {{ .Values.engine.port }}, protocol: TCP}
    {{- end }}
    {{- if $ciHere }}
    # dagron-ci's port, which is in this pod (ci.placement: engine). From
    # anywhere, as it is where dagron-ci has a pod of its own, which no
    # policy here selects: a forge's webhook comes through an ingress
    # controller this chart does not know, and each of dagron-ci's doors
    # asks for a signature, a credential or a secret. The engine's own port
    # is as closed as it was.
    - ports:
        - {port: {{ .Values.ci.port }}, protocol: TCP}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- if .Values.postgres.enabled }}
---
# The datastore is reachable only from the components that use it — not from task pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dagron.fullname" . }}-postgres
  labels:
    {{- include "dagron.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [engine, dagron-api, gitops, operator{{ if .Values.ci.enabled }}, dagron-ci{{ end }}{{ if .Values.backup.enabled }}, backup{{ end }}]}
        {{- with .Values.networkPolicy.postgres.allowFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - {port: 5432, protocol: TCP}
{{- end }}
{{- end }}
