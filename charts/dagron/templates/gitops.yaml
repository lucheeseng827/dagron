{{- if .Values.gitops.enabled }}
# dagron-gitops — the GitOps worker: reconciles workflow definitions from the Git
# repositories registered in the console into the same Postgres dagron-api owns.
#
# OFF BY DEFAULT, matching how it deploys everywhere else (compose puts it behind
# a `gitops` profile). It is the one dagron image that carries a `git` binary,
# which is exactly why it is a separate deployable: dagron-api stays distroless
# and subprocess-free for the majority of installs that never connect a repo.
#
# No Service and no probes: this is a polling worker, not a server. It listens on
# nothing, so a readiness probe would have nothing to ask.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dagron.fullname" . }}-gitops
  labels:
    {{- include "dagron.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitops
spec:
  # Deliberately 1. Each replica polls every registered repo on its own timer;
  # a second one duplicates that work against the same rows for no benefit.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gitops
  template:
    metadata:
      labels:
        {{- include "dagron.labels" . | nindent 8 }}
        app.kubernetes.io/component: gitops
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gitops
          image: {{ include "dagron.image" (dict "image" $.Values.gitops.image "root" $) | quote }}
          imagePullPolicy: {{ .Values.gitops.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            # Stays read-only like its siblings: the only thing this worker
            # writes is a clone, and that goes to the emptyDir mounted at /tmp.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dagron.dbSecretName" . }}
                  key: {{ include "dagron.dbSecretKey" . }}
            - name: GITOPS_POLL_SECS
              value: {{ .Values.gitops.pollSecs | quote }}
            - name: RUST_LOG
              value: {{ .Values.gitops.rustLog | quote }}
            # git wants somewhere to resolve config from; point it at the same
            # writable scratch so it never probes an unwritable $HOME.
            - name: HOME
              value: /tmp
            {{- if eq (include "dagron.envSecretsEnabled" .) "true" }}
            # Decrypts the per-repository Git credentials (HTTPS token / SSH
            # key) stored from the console. The same key dagron-api encrypts
            # them with — this worker is the only thing that reads them back.
            - name: {{ include "dagron.envSecretKeyName" . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "dagron.envSecretName" . }}
                  key: {{ include "dagron.envSecretKeyName" . }}
            {{- end }}
            {{- if .Values.gitops.sshStrictHostKeyChecking }}
            # Refuse an SSH sync for a repo with no pinned known_hosts rather
            # than trusting whatever host answers.
            - name: DAGRON_GIT_SSH_STRICT
              value: "1"
            {{- end }}
            {{- if .Values.gitops.tokenSecret.name }}
            # Fallback token for repositories with no credential of their own.
            # Sent only to trusted forge hosts over HTTPS; leave unset for
            # public repos.
            - name: DAGRON_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitops.tokenSecret.name }}
                  key: {{ .Values.gitops.tokenSecret.key | default "DAGRON_GIT_TOKEN" }}
            {{- end }}
            {{- with .Values.gitops.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            # MUST be /tmp: the worker clones into `std::env::temp_dir()`
            # (crates/dagron-gitops/src/sync.rs), which is /tmp unless TMPDIR
            # says otherwise. Mount it anywhere else and every sync fails on a
            # read-only filesystem.
            - name: scratch
              mountPath: /tmp
          resources:
            {{- toYaml .Values.gitops.resources | nindent 12 }}
      volumes:
        # Checkouts are disposable — the repo is the source of truth and every
        # reconcile re-reads it, so nothing here needs to survive a restart.
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.gitops.scratchSizeLimit }}
{{- end }}
