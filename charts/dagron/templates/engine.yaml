{{- /* dagron-ci as a container of this pod (ci.placement: engine). */}}
{{- $ciHere := eq (include "dagron.ci.inEnginePod" .) "true" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dagron.fullname" . }}-engine
  labels:
    {{- include "dagron.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
  {{- with .Values.engine.serviceAccount.annotations }}
  # Workload identity: what the engine reaches its own cloud storage as
  # (DAGRON_ARTIFACT_URL, GC_ARCHIVE_URL).
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if eq .Values.engine.executor "k8s" }}
---
# EXECUTOR=k8s: the engine creates one-shot task Pods in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dagron.fullname" . }}-engine
  labels:
    {{- include "dagron.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # A workflow's Docker action is a container added to its job's own pod,
  # an ephemeral one, which shares the job's workspace.
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["get", "patch"]
  # A task's secret env vars (`value_from`) reach its pod by secretKeyRef from a
  # per-task Secret rather than as plaintext in the Pod spec (DAGRON_TASK_SECRET_ENV;
  # `inline` needs none of this). The engine creates it, owns it by the pod, deletes it.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
  {{- if .Values.engine.taskNetworkPolicy }}
  # The policy that takes the network from a task that asked for none
  # (engine.taskNetworkPolicy). The engine reads the namespace's policies as
  # it starts and before each such task: that one, to see that it is there
  # and is what it is taken for, and the rest, since a pod has what any
  # policy that selects it allows. It makes none of its own.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dagron.fullname" . }}-engine
  labels:
    {{- include "dagron.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dagron.fullname" . }}-engine
subjects:
  - kind: ServiceAccount
    name: {{ include "dagron.fullname" . }}-engine
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dagron.fullname" . }}-engine
  labels:
    {{- include "dagron.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.engine.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: engine
  template:
    metadata:
      {{- if $ciHere }}
      {{- /* What dagron-ci reads once, as it starts: changed, it starts
             this pod again. */}}
      {{- with (include "dagron.ci.podAnnotations" . | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
      {{- end }}
      labels:
        {{- include "dagron.labels" . | nindent 8 }}
        app.kubernetes.io/component: engine
        {{- with .Values.engine.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dagron.fullname" . }}-engine
      {{- if $ciHere }}
      # dagron-ci shares this pod, takes a forge's webhooks, and asks the
      # cluster for nothing. A pod's service-account token is given to every
      # container of it, so it is not mounted by the pod: the engine's
      # container mounts it alone (kube-api-access, below), where the engine
      # has always read it.
      automountServiceAccountToken: false
      {{- end }}
      # The image's user (Dockerfile: USER 65532:65532, distroless's nonroot),
      # who owns the /workflows the engine seeds on first start; on OpenShift,
      # the uid its SCC gives, in group 0, which /workflows is open to.
      securityContext:
        {{- include "dagron.podSecurityContext" (dict "root" $ "uid" 65532 "fsGroup" true) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
        - name: engine
          image: {{ include "dagron.image" (dict "image" $.Values.engine.image "root" $) | quote }}
          imagePullPolicy: {{ .Values.engine.imagePullPolicy }}
          # No readOnlyRootFilesystem: the entrypoint seeds /workflows on the
          # image's root fs. Everything else is locked down.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dagron.dbSecretName" . }}
                  key: {{ include "dagron.dbSecretKey" . }}
            {{- if and (not .Values.postgres.enabled) .Values.externalDatabaseSecret.listenKey }}
            # Split-DSN: DATABASE_URL may point at a transaction pooler, which
            # cannot serve the session-scoped LISTEN the reconcile loop needs.
            # This key carries the DIRECT endpoint for that one connection.
            - name: DATABASE_LISTEN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dagron.dbSecretName" . }}
                  key: {{ .Values.externalDatabaseSecret.listenKey }}
            {{- end }}
            {{- if and (not .Values.postgres.enabled) .Values.externalDatabaseSecret.controlKey }}
            # Hosted installs: the platform's usage database, for the engine's
            # meter and run-completion hook (see values.yaml workspaceId).
            - name: CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dagron.dbSecretName" . }}
                  key: {{ .Values.externalDatabaseSecret.controlKey }}
            {{- end }}
            {{- if and .Values.workspaceId .Values.orgId }}
            - name: DAGRON_WORKSPACE_ID
              value: {{ .Values.workspaceId | quote }}
            - name: DAGRON_ORG_ID
              value: {{ .Values.orgId | quote }}
            {{- end }}
            {{- if include "dagron.openshift" . }}
            # OpenShift: a task pod names no fsGroup for its claim
            # workspace, the SCC gives one, and its containers are given the
            # envelope the restricted SCC holds them to, as non-root without a
            # uid of their own.
            - name: DAGRON_TASK_FS_GROUP
              value: none
            - name: DAGRON_TASK_RUN_AS_NON_ROOT
              value: "1"
            - name: DAGRON_TASK_DROP_ALL_CAPABILITIES
              value: "1"
            - name: DAGRON_TASK_SECCOMP_RUNTIME_DEFAULT
              value: "1"
            {{- end }}
            - name: API_ADDR
              value: "0.0.0.0:{{ .Values.engine.port }}"
            - name: EXECUTOR
              value: {{ .Values.engine.executor | quote }}
            - name: K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: K8S_IMAGE
              value: {{ include "dagron.image" (dict "image" $.Values.engine.taskImage "root" $) | quote }}
            - name: WORKER_COUNT
              value: {{ .Values.engine.workerCount | quote }}
            - name: DB_SCHEDULES
              value: {{ ternary "1" "0" .Values.engine.dbSchedules | quote }}
            # Admission cap for POST /runs: the engine returns 429 + Retry-After
            # once this many runs are active, instead of growing an unbounded
            # backlog (a load-test finding). 0 disables the cap.
            - name: MAX_INFLIGHT_RUNS
              value: {{ .Values.engine.maxInflightRuns | quote }}
            - name: RUST_LOG
              value: {{ .Values.engine.rustLog | quote }}
            {{- if and (eq .Values.engine.executor "k8s") .Values.engine.taskNetworkPolicy }}
            # The operator's word that this cluster's CNI enforces
            # NetworkPolicy: a task that asks for no network is then labelled
            # for the policy the chart makes, and is refused without this.
            - name: DAGRON_TASK_NETWORK_POLICY
              value: enforced
            {{- with (keys (.Values.engine.taskNetworkAllowlists | default dict) | sortAlpha) }}
            # The allowlists made above, by name: a task may name one of
            # these (isolation.network: allow:<name>) and no other.
            - name: DAGRON_TASK_NETWORK_ALLOWLISTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.engine.taskPriorityClassName }}
            - name: DAGRON_TASK_PRIORITY_CLASS
              value: {{ . | quote }}
            {{- end }}
            {{- if eq (include "dagron.envSecretsEnabled" .) "true" }}
            # Decrypts environment secrets at task dispatch (dagron-api holds
            # the same key to encrypt them on write).
            - name: {{ include "dagron.envSecretKeyName" . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "dagron.envSecretName" . }}
                  key: {{ include "dagron.envSecretKeyName" . }}
            {{- end }}
            {{- if and $ciHere .Values.ci.checkoutTokenSecret.name }}
            # A private repository's checkout: the engine asks dagron-ci for
            # its credential, with the secret both hold in a file. dagron-ci
            # is in this pod, so the address is the pod's own, and plain http
            # to it crosses no network: the engine takes no other over http.
            - name: DAGRON_CHECKOUT_TOKEN_URL
              value: "http://127.0.0.1:{{ .Values.ci.port }}/ci/v1/checkout-tokens"
            - name: DAGRON_CHECKOUT_TOKEN_SECRET_FILE
              value: /etc/dagron/checkout-secret/value
            {{- end }}
            {{- with .Values.engine.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.engine.port }}
          {{- if $ciHere }}
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- if .Values.ci.checkoutTokenSecret.name }}
            - name: checkout-secret
              mountPath: /etc/dagron/checkout-secret
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
        {{- if $ciHere }}
        {{- include "dagron.ci.container" . | nindent 8 }}
        {{- end }}
      {{- if $ciHere }}
      volumes:
        # What a pod's automount would have given every container: the
        # service account's token, the cluster's CA and the namespace.
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        {{- with (include "dagron.ci.volumes" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dagron.fullname" . }}-engine
  labels:
    {{- include "dagron.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  type: {{ .Values.engine.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: engine
  ports:
    - port: {{ .Values.engine.port }}
      targetPort: {{ .Values.engine.port }}
      name: http
